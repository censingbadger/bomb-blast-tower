<!-- Bomb Blast Tower — THE TOWER (the game!)
     An isometric 2.5D action crawler in the spirit of Back Stab's dungeon
     mode (Jing & Ash Games): WASD/arrows or touch joystick to move,
     K / click / ATTACK to swing, SPACE to hop, B to drop a bomb.
     You climb the tower floor by floor: dark dank halls with torches,
     red carpets and hanging chains; walls block your way (bomb the cracked
     ones), platforms need a bomb-boost to reach, spikes and monsters wait.
     Die and the floor resets. Reach the staircase: VICTORY — you beat this
     floor — then you're teleported home, ready to start the next one.
     Floor progress and gems share localStorage with the Market. -->

:root {
  --ink: #f0e8d8;
  --dim: #9b8f7c;
  --wood: #b06f34;
  --wood-dark: #7a4a1f;
  --blood: #a71d2a;
  --gem: #3ec6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
  background: #0b0812;
  color: var(--ink);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
#game { position: fixed; inset: 0; display: block; }

/* ---------- HUD ---------- */
.hud {
  position: fixed;
  top: max(.6rem, env(safe-area-inset-top));
  left: .8rem; right: .8rem;
  display: flex;
  align-items: flex-start;
  gap: .9rem;
  pointer-events: none;
  z-index: 10;
}
.hud .chip {
  display: flex; align-items: center; gap: .4rem;
  background: rgba(12,8,18,.72);
  border: 2px solid #3a3046;
  border-radius: 999px;
  padding: .35rem .8rem .25rem;
  font-family: 'Luckiest Guy', cursive;
  font-size: 1.05rem;
  letter-spacing: .04em;
}
.hud { flex-wrap: wrap; row-gap: .45rem; }
.hud .mats { gap: .5rem; font-size: .95rem; color: #cfc6ba; }
.hud .mats span { min-width: 1em; }
.hud .hearts { font-size: 1.2rem; letter-spacing: .06em; color: #ff4d5e; }
.hud .hearts .half { color: #ff9d5e; }
.hud .hearts .empty { color: #4a3a46; }
.hud svg { width: 1.05em; height: auto; }
#bombchip svg { width: 1.3em; }
.floorname {
  margin: 0 auto;
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: var(--ink);
  text-shadow: 0 2px 0 #000, 0 0 18px rgba(255,140,26,.35);
  background: rgba(12,8,18,.55);
  border: 2px solid #3a3046;
  border-radius: 999px;
  padding: .4rem 1.1rem .25rem;
}
.quit {
  pointer-events: auto;
  font-family: 'Luckiest Guy', cursive;
  font-size: .95rem;
  color: var(--ink);
  background: rgba(12,8,18,.72);
  border: 2px solid #3a3046;
  border-radius: 999px;
  padding: .4rem .9rem .25rem;
  cursor: pointer;
  text-decoration: none;
}
.quit:hover { border-color: #6b5c80; }
#mute.needstap { animation: mutepulse 1.1s ease-in-out infinite; }
@keyframes mutepulse { 50% { transform: scale(1.16); box-shadow: 0 0 14px rgba(255,210,63,.75); } }

/* ---------- touch controls ---------- */
.tc { position: fixed; bottom: max(1rem, env(safe-area-inset-bottom)); z-index: 10; }
#joyzone { left: 0; width: 46vw; height: 42vh; bottom: 0; position: fixed; z-index: 9; }
#joy {
  left: 4.5vw; width: 108px; height: 108px;
  border-radius: 50%;
  background: rgba(255,255,255,.05);
  border: 2px solid rgba(255,255,255,.14);
  display: none;
}
#joy .knob {
  position: absolute; left: 50%; top: 50%;
  width: 48px; height: 48px; margin: -24px 0 0 -24px;
  border-radius: 50%;
  background: rgba(255,255,255,.22);
  border: 2px solid rgba(255,255,255,.3);
}
.tbtns { right: 3vw; display: none; flex-direction: column; gap: .7rem; align-items: flex-end; }
.tbtn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,.28);
  background: rgba(20,14,30,.66);
  color: var(--ink);
  font-family: 'Luckiest Guy', cursive;
  font-size: .78rem;
  letter-spacing: .04em;
  display: grid; place-items: center;
  cursor: pointer;
}
.tbtn.big { width: 76px; height: 76px; font-size: .9rem; border-color: rgba(255,120,90,.55); }
.touch .tbtns { display: flex; }
.touch #joy { display: block; position: fixed; bottom: 7vh; }

/* ---------- banners & overlays ---------- */
#banner {
  position: fixed;
  left: 50%; top: 34%;
  transform: translate(-50%, -50%) scale(.9);
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(1.6rem, 6vw, 3rem);
  color: #ffd23f;
  text-shadow: 0 3px 0 #5b3a00, 0 0 30px rgba(255,140,26,.5);
  letter-spacing: .06em;
  opacity: 0;
  pointer-events: none;
  z-index: 15;
  text-align: center;
  white-space: nowrap;
}
#banner.show { animation: bannerpop 1.6s ease forwards; }
@keyframes bannerpop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
  22% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
}
.overlay {
  position: fixed; inset: 0;
  background: rgba(5,3,10,.78);
  display: none;
  align-items: center; justify-content: center;
  z-index: 20;
  text-align: center;
}
.overlay.show { display: flex; }
.overlay .panel {
  padding: 2rem 2.4rem;
  max-width: 92vw;
}
.overlay h1 {
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(2.2rem, 8vw, 4rem);
  letter-spacing: .05em;
  margin-bottom: .4rem;
}
#death h1 { color: #ff4d5e; text-shadow: 0 4px 0 #4a000a, 0 0 40px rgba(255,60,80,.4); }
#victory h1 { color: #ffd23f; text-shadow: 0 4px 0 #5b3a00, 0 0 40px rgba(255,200,60,.45); }
.overlay p { font-size: 1.35rem; color: var(--ink); margin-bottom: 1.1rem; }
.overlay .sub { font-size: 1.05rem; color: var(--dim); }
.overlay .btn {

/* ============================================================

/* The six bombs, straight from the drawings. boost: 'up' | 'side' | 'diag' */
/* Every bomb has ONE job now — you pick the right tool:
   Bomb      = the ONLY one that boosts you UP onto platforms
   Dynamite  = the ONLY one that blows up cracked walls
   Landmine  = the trap: monsters step on it — and it dashes YOU sideways
   Time Bomb = you set the timer, and it hits the HARDEST
   Remote    = place a whole bunch, then R sets them ALL off at once
   Stick     = sticks to monsters and walls; the only DIAGONAL boost */
const BOMB_TYPES = {
  bomb:     { name: 'Bomb',        fuse: 1150, radius: 1.9, dmg: 2, breaksWalls: false, boost: 'up',
              desc: 'the ONLY bomb that boosts you UP' },
  dynamite: { name: 'Dynamite',    fuse: 1400, radius: 2.7, dmg: 4, breaksWalls: true, boost: null,
              desc: 'the ONLY bomb that blows up walls' },

              desc: 'sticks to monsters — the only DIAGONAL boost' },

const BOMB_ORDER = ['bomb', 'dynamite', 'landmine', 'timebomb', 'remote', 'stick'];
const BOMB_ICONS = {
  bomb: '<svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="7" fill="#26262f" stroke="#f0e8d8" stroke-width="1.6"/><path d="M12 8 C11 5.5 14 5 13.5 3" fill="none" stroke="#a9743c" stroke-width="1.8"/><path d="M13.5 3 l2 -1.4" stroke="#ff8c1a" stroke-width="1.8"/></svg>',
  dynamite: '<svg viewBox="0 0 24 24"><rect x="5" y="8" width="4" height="13" rx="1.6" fill="#b3402a"/><rect x="10" y="6" width="4" height="15" rx="1.6" fill="#c9532f"/><rect x="15" y="8" width="4" height="13" rx="1.6" fill="#b3402a"/><path d="M12 6 C11.5 4 13.5 3.5 13 2" fill="none" stroke="#a9743c" stroke-width="1.6"/><rect x="4.5" y="13" width="15" height="2.4" fill="#6b3a1a"/></svg>',
  landmine: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="9" ry="4.5" fill="#6a7280" stroke="#3a4048" stroke-width="1.5"/><ellipse cx="12" cy="13.5" rx="4.5" ry="2.2" fill="#8d959d"/><circle cx="12" cy="13" r="1.6" fill="#e33"/></svg>',
  timebomb: '<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2" fill="#33333e" stroke="#111" stroke-width="1.4"/><rect x="7" y="11" width="10" height="5" rx="1" fill="#dff3e0"/><path d="M9 13.5 h6" stroke="#1a7a2a" stroke-width="1.8"/><path d="M12 8 V5" stroke="#a9743c" stroke-width="1.6"/></svg>',
  remote: '<svg viewBox="0 0 24 24"><circle cx="10" cy="16" r="6" fill="#26262f" stroke="#f0e8d8" stroke-width="1.5"/><path d="M13 11 L18 4" stroke="#8d959d" stroke-width="1.8"/><circle cx="18.5" cy="3.5" r="2" fill="#e33"/></svg>',
  stick: '<svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="7.5" fill="#3c6e33" stroke="#1e3a18" stroke-width="1.5"/><path d="M6 11 h12 M6 17 h12 M9 7.5 v13 M15 7.5 v13" stroke="#1e3a18" stroke-width="1.2" fill="none"/><circle cx="16" cy="5" r="2.4" fill="none" stroke="#c9ced6" stroke-width="1.6"/></svg>',
};

const ENEMY_KINDS = {
  zombie:   { hp: 3, speed: 1.25, aggro: 5.5, dmg: 1, swipeCool: 1150, gems: 4, body: '#5da24e', cloth: '#3c6e33', eye: '#d0ffb0' },
  skeleton: { hp: 2, speed: 2.05, aggro: 6.5, dmg: 1, swipeCool: 950,  gems: 3, body: '#e8e4da', cloth: '#8d959d', eye: '#222' },
};

/* ============================================================ */
const ISO = { TW: 64, TH: 32 };
const WALL_H = 46, PLAT_H = 26;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = s => document.querySelector(s);

const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rand = seed => { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const isoX = (fx, fy) => (fx - fy) * (ISO.TW / 2);
const isoY = (fx, fy) => (fx + fy) * (ISO.TH / 2);

/* ============================================================
   FLOORS 4-50 — the tower keeps GOING.
   Each floor is built by this little generator out of its own
   floor number, so Floor 17 is always the same Floor 17 (nobody
   gets a different tower), and every floor is checked to make
   sure you can really walk from the start to the staircase
   without needing a single bomb. Bombs are for shortcuts,
   cracked walls, platforms and monsters.
   ============================================================ */
const DEEP_NAMES = [
  'The Dusty Halls', 'The Broken Kitchens', 'The Chained Cellar', 'The Rat Warren',
  'The Spider Landing', 'The Cracked Gallery', 'The Warden’s Floor', 'The Torch Maze',
  'The Old Barracks', 'The Creaky Stairwell', 'The Bone Pit', 'The Rusted Armory',
  'The Whispering Hall', 'The Crumbling Bridge', 'The Mushroom Cellar', 'The Iron Kennels',
  'The Gatekeeper’s Floor', 'The Frozen Landing', 'The Shattered Library', 'The Trap Workshop',
  'The Echo Chamber', 'The Sunken Corridor', 'The Candle Vault', 'The Skeleton Choir',
  'The Long Fall', 'The Rubble Yard', 'The Alchemist’s Floor', 'The Glass Stairs',
  'The Storm Balcony', 'The Hollow Rafters', 'The Grave Garden', 'The Molten Passage',
  'The Clockwork Landing', 'The Mirror Hall', 'The Buried Chapel', 'The Thorn Corridor',
  'The Champion’s Floor', 'The Ash Terrace', 'The Silent Vault', 'The Serpent Coil',
  'The Last Barracks', 'The Ember Walk', 'The Void Landing', 'The Warlock’s Stair',
  'The Black Gallery', 'The Tower Crown', 'The Warlock’s Roost',
];
const DEEP_TIPS = [
  'Stick bombs ride monsters — try it!',
  'Dynamite makes the BIGGEST hole.',
  'Boost up the platforms for a shortcut.',
  'Landmines wait for whoever steps first.',
  'Set the timer with T, then run!',
  'Remote bombs wait for R — be patient.',
  'Cracked walls hide the quick way round.',
  'Bombs never hurt you. Monsters, though…',
  'Skeletons are fast. Spikes are patient.',
  'Grab every crate you see.',
  'Your bombs boost you — mind the spikes.',
  'The staircase is always somewhere…',
];


/* one try at a floor — returns null if it doesn't keep the promises below */
function buildFloor(n, attempt) {
  let seed = (n * 1103515 + attempt * 7919 + 12345) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));

  const deep = n - 3;                       // 1..47
  const milestone = n % 10 === 0 || n === 50;
  const W = Math.min(36, 22 + Math.floor(deep / 3) + (milestone ? 2 : 0));
  const H = Math.min(23, 12 + Math.floor(deep / 5) + (milestone ? 2 : 0));
  // most floors make you boost a platform; two thirds make you blow a wall open
  const wantPlat = n % 4 !== 0;
  const wantCrack = deep >= 2 && n % 3 !== 0;
  const platWanted = wantPlat ? (deep >= 18 ? 2 : 1) : 0;

  const g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill('#'));
  const at = (x, y) => (g[y] && g[y][x]) || '#';
  const set = (x, y, ch) => { if (x > 0 && y > 0 && x < W - 1 && y < H - 1) g[y][x] = ch; };

  /* --- rooms, one per zone, spread over the WHOLE floor so the walk is long --- */
  const cols = Math.min(5, 3 + Math.floor(deep / 18));
  const rows = Math.min(3, 2 + Math.floor(deep / 24));
  const cellW = Math.floor(W / cols), cellH = Math.floor(H / rows);
  if (cellW < 6 || cellH < 5) return null;
  const grid = [];
  for (let r = 0; r < rows; r++) {
    grid.push([]);
    for (let c = 0; c < cols; c++) {
      const rw = Math.min(cellW - 2, ri(4, 7)), rh = Math.min(cellH - 2, ri(3, 5));
      const rx = c * cellW + 1 + ri(0, Math.max(0, cellW - rw - 2));
      const ry = r * cellH + 1 + ri(0, Math.max(0, cellH - rh - 2));
      grid[r].push({ x: rx, y: ry, w: rw, h: rh, cx: rx + (rw >> 1), cy: ry + (rh >> 1) });
    }
  }
  /* walk the zones like a snake: across, down, back across… the staircase
     ends up in the last zone, as far from the start as the floor allows */
  const chain = [];
  for (let r = 0; r < rows; r++) {
    const row = r % 2 === 0 ? grid[r] : grid[r].slice().reverse();
    row.forEach(room => chain.push(room));
  }
  // a couple of zones stand empty on bigger floors, so no two floors feel alike
  const drops = deep >= 10 ? ri(0, 2) : 0;
  for (let d = 0; d < drops && chain.length > 4; d++) {
    const idx = ri(1, chain.length - 2);
    chain.splice(idx, 1);
  }
  if (rnd() < 0.5) chain.reverse();          // sometimes you climb the snake the other way
  const rooms = chain.slice();
  rooms.forEach(r => { for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) set(x, y, '.'); });
  const inRoom = (x, y) => rooms.some(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
  const start = chain[0], goal = chain[chain.length - 1];

  /* --- corridors, one per link in the chain --- */
  const corridorPath = (a, b, horizFirst) => {
    const pts = []; let x = a.cx, y = a.cy;
    if (horizFirst) {
      while (x !== b.cx) { x += Math.sign(b.cx - x); pts.push([x, y]); }
      while (y !== b.cy) { y += Math.sign(b.cy - y); pts.push([x, y]); }
    } else {
      while (y !== b.cy) { y += Math.sign(b.cy - y); pts.push([x, y]); }
      while (x !== b.cx) { x += Math.sign(b.cx - x); pts.push([x, y]); }
    }
    return pts;
  };
  const links = [];
  for (let i = 1; i < chain.length; i++) {
    const pts = corridorPath(chain[i - 1], chain[i], rnd() < 0.5);
    pts.forEach(([x, y]) => set(x, y, '.'));
    links.push(pts);
  }

  /* --- GATES: a platform you must boost over, a wall you must blow open.
         They go in the rock between rooms, where the corridor is one tile
         wide, so there is no way to walk around them. --- */
  const taken = new Set();
  const gateSpot = (pts, len) => {
    const runs = []; let run = [];
    for (let i = 1; i < pts.length; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i];
      const dir = (x - px) + ',' + (y - py);
      if (inRoom(x, y) || inRoom(px, py)) { if (run.length) runs.push(run); run = []; continue; }
      if (!run.length) run = [{ x: px, y: py, dir }, { x, y, dir }];
      else if (run[run.length - 1].dir === dir) run.push({ x, y, dir });
      else { runs.push(run); run = [{ x: px, y: py, dir }, { x, y, dir }]; }
    }
    if (run.length) runs.push(run);
    // leave a tile of corridor on each side to stand on and to land on
    const good = runs.filter(r => r.length >= len + 2 && r.every(p => !taken.has(p.x + ',' + p.y)));
    if (!good.length) return null;
    const r = good[Math.floor(rnd() * good.length)];
    const i0 = Math.floor((r.length - len) / 2);
    const spot = r.slice(i0, i0 + len).map(p => [p.x, p.y]);
    spot.forEach(([x, y]) => taken.add(x + ',' + y));
    return spot;
  };
  const gates = [];
  const lastLink = links.length - 1;
  let platsPlaced = 0;
  // the way into the staircase room is ALWAYS shut: bomb it open, or boost over it
  if (lastLink >= 0) {
    const type = wantCrack ? 'crack' : 'plat';
    const spot = gateSpot(links[lastLink], type === 'crack' ? (rnd() < 0.4 ? 2 : 1) : 2);
    if (!spot) return null;
    spot.forEach(([x, y]) => set(x, y, type === 'crack' ? '%' : 'P'));
    gates.push({ type, tiles: spot });
    if (type === 'plat') platsPlaced++;
  }
  const order = [];
  for (let i = 0; i < lastLink; i++) order.push(i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
  for (const li of order) {
    if (platsPlaced >= platWanted) break;
    const spot = gateSpot(links[li], 2);
    if (spot) { spot.forEach(([x, y]) => set(x, y, 'P')); gates.push({ type: 'plat', tiles: spot }); platsPlaced++; }
  }
  if (wantPlat && !platsPlaced) return null;
  if (wantCrack && !gates.some(x => x.type === 'crack')) return null;
  if (!gates.length) return null;

  /* --- red carpets --- */
  rooms.forEach(r => {
    if (rnd() > 0.78) return;
    const ring = rnd() < 0.55;
    for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {
      const edge = x === r.x || y === r.y || x === r.x + r.w - 1 || y === r.y + r.h - 1;
      if (at(x, y) === '.' && (ring ? edge : !edge)) set(x, y, 'c');
    }
  });

  /* --- spike traps --- */
  const spikeCount = Math.min(16, 1 + Math.floor(deep / 2));
  for (let i = 0, tries = 0; i < spikeCount && tries < 400; tries++) {
    const x = ri(1, W - 2), y = ri(1, H - 2), c = at(x, y);
    if (c !== '.' && c !== 'c') continue;
    if (Math.abs(x - start.cx) + Math.abs(y - start.cy) < 4) continue;
    set(x, y, '^'); i++;
  }

  /* --- a few extra cracked walls: optional shortcuts --- */
  const crackCount = Math.min(7, 1 + Math.floor(deep / 7));
  for (let i = 0, tries = 0; i < crackCount && tries < 300; tries++) {
    const x = ri(1, W - 2), y = ri(1, H - 2);
    if (at(x, y) !== '#') continue;
    const open = c => c !== '#' && c !== '%';
    if ((open(at(x - 1, y)) && open(at(x + 1, y))) || (open(at(x, y - 1)) && open(at(x, y + 1)))) { set(x, y, '%'); i++; }
  }

  /* --- bomb crates: always one waiting in the room before each gate --- */
  const dropCrate = room => {
    for (let tries = 0; tries < 60; tries++) {
      const x = ri(room.x, room.x + room.w - 1), y = ri(room.y, room.y + room.h - 1), c = at(x, y);
      if (c === '.' || c === 'c') { set(x, y, 'b'); return true; }
    }
    return false;
  };
  gates.forEach(gt => {
    const [gx, gy] = gt.tiles[0];
    let best = chain[0], bd = Infinity;
    chain.forEach((r, i) => {
      const d = Math.abs(r.cx - gx) + Math.abs(r.cy - gy);
      if (d < bd && i < chain.length - 1) { bd = d; best = r; }
    });
    dropCrate(best);
  });
  for (let i = 0; i < 1 + Math.floor(deep / 12); i++) dropCrate(chain[ri(0, chain.length - 1)]);

  /* --- bad guys, with extra muscle guarding the staircase --- */
  const enemyCount = Math.min(16, 3 + Math.round(deep * 0.32) + (milestone ? 2 : 0));
  const skelChance = Math.min(0.6, 0.15 + deep * 0.012);
  const lateRooms = chain.slice(Math.max(1, chain.length - 2));
  for (let i = 0, tries = 0; i < enemyCount && tries < 700; tries++) {
    const guard = i < Math.ceil(enemyCount * 0.4);
    const r = guard ? lateRooms[ri(0, lateRooms.length - 1)] : chain[ri(0, chain.length - 1)];
    const x = ri(r.x, r.x + r.w - 1), y = ri(r.y, r.y + r.h - 1), c = at(x, y);
    if (c !== '.' && c !== 'c') continue;
    if (Math.abs(x - start.cx) + Math.abs(y - start.cy) < 5) continue;
    set(x, y, rnd() < skelChance ? 'k' : 'z'); i++;
  }

  /* --- nothing sharp where you start, or where you land off a gate --- */
  const clearSpikes = (cx, cy, rad) => {
    for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
      if (at(cx + dx, cy + dy) === '^') set(cx + dx, cy + dy, '.');
    }
  };
  clearSpikes(start.cx, start.cy, 1);
  gates.forEach(gt => gt.tiles.forEach(([x, y]) => clearSpikes(x, y, 1)));
  set(start.cx, start.cy, 'S');
  set(goal.cx, goal.cy, 'X');

  /* --- check the promises --- */
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const walkDist = blocked => {
    const seen = g.map(row => row.map(() => -1));
    const q = [[start.cx, start.cy]];
    seen[start.cy][start.cx] = 0;
    for (let qi = 0; qi < q.length; qi++) {
      const [x, y] = q[qi];
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen[ny][nx] >= 0) continue;
        if (at(nx, ny) === '#') continue;                       // rock is rock
        if (blocked && blocked.has(nx + ',' + ny)) continue;     // pretend this gate is shut
        seen[ny][nx] = seen[y][x] + 1;
        q.push([nx, ny]);
      }
    }
    return seen[goal.cy][goal.cx];
  };
  const dist = walkDist(null);
  if (dist < 0) return null;                                     // you can always finish the floor
  for (const gt of gates) {                                      // …but never around a gate
    if (walkDist(new Set(gt.tiles.map(t => t[0] + ',' + t[1]))) >= 0) return null;
  }

  const hasP = gates.some(x => x.type === 'plat'), hasC = gates.some(x => x.type === 'crack');
  const cap = v => Math.min(9, v);
  /* THE PUZZLE PACK: exactly what this floor demands, plus one spare each.
     More platform gates = more bombs in your pack; an easy floor keeps you
     honest with a lean one. (We take the bigger of the cheapest-route math
     and the gate count, so the obvious route is always affordable too.) */
  const gridRows = g.map(row => row.join(''));
  const need = bombNeeds(gridRows);
  const platGates = gates.filter(x => x.type === 'plat').length;
  const crackGates = gates.filter(x => x.type === 'crack').length;
  return {
    pathLen: dist,
    def: {
      name: 'FLOOR ' + n + ' — ' + DEEP_NAMES[n - 4].toUpperCase(),
      tip: milestone ? 'The Warlock is watching this floor…'
        : hasP && hasC ? 'Boost over the platform, then BOMB your way to the stairs!'
        : hasC ? 'A cracked wall stands between you and the stairs — BOMB IT!'
        : hasP ? 'No way around the platform — drop a bomb and BOOST up!'
        : DEEP_TIPS[(n * 5) % DEEP_TIPS.length],
      hpBonus: Math.floor(deep / 8),
      gates,
      loadout: {
        bomb: cap(Math.max(need.bombs, platGates) + 1 + Math.floor(deep / 16)),
        dynamite: cap(Math.max(need.dynamite, crackGates) + 1 + Math.floor(deep / 20)),
        landmine: cap(2 + Math.floor(deep / 12)),
        timebomb: cap(2 + Math.floor(deep / 12)),
        remote: cap(2 + Math.floor(deep / 12)),
        stick: cap(2 + Math.floor(deep / 14)),
      },
      grid: gridRows,
    },
  };
}

/* if the dice never cooperate, this snake of a floor always works:
   one tunnel, a platform across it, a cracked wall after that, stairs at the end */
function linearFloor(n) {
  const deep = n - 3;
  const W = Math.min(36, 22 + Math.floor(deep / 3)), H = Math.min(23, 12 + Math.floor(deep / 5));
  const g = [];
  for (let y = 0; y < H; y++) g.push(new Array(W).fill('#'));
  const set = (x, y, ch) => { if (x > 0 && y > 0 && x < W - 1 && y < H - 1) g[y][x] = ch; };
  const lanes = [2, H >> 1, H - 3];
  lanes.forEach(y => { for (let x = 2; x < W - 2; x++) set(x, y, '.'); });
  for (let y = lanes[0]; y <= lanes[1]; y++) set(W - 3, y, '.');
  for (let y = lanes[1]; y <= lanes[2]; y++) set(2, y, '.');
  // little side rooms hanging off the tunnel (dead ends can't become shortcuts)
  [[6, lanes[0]], [W - 8, lanes[1]], [8, lanes[2]]].forEach(([bx, by], i) => {
    for (let y = by - 1; y <= by + 1; y++) for (let x = bx - 1; x <= bx + 1; x++) set(x, y, i === 1 ? 'c' : '.');
  });
  const mid = W >> 1;
  set(mid, lanes[1], 'P'); set(mid + 1, lanes[1], 'P');            // must boost
  set(mid, lanes[2], '%');                                        // must bomb
  set(5, lanes[0], 'b'); set(mid - 4, lanes[1], 'b'); set(6, lanes[2], 'b');
  set(W - 8, lanes[0], 'z'); set(8, lanes[1], 'z'); set(mid + 4, lanes[2], 'k');
  set(W - 5, lanes[2], 'z');
  set(3, lanes[0], 'S'); set(W - 3, lanes[2], 'X');
  return {
    name: 'FLOOR ' + n + ' — ' + DEEP_NAMES[n - 4].toUpperCase(),
    tip: 'Boost over the platform, then BOMB your way to the stairs!',
    hpBonus: Math.floor(deep / 8),
    gates: [{ type: 'plat', tiles: [[mid, lanes[1]], [mid + 1, lanes[1]]] }, { type: 'crack', tiles: [[mid, lanes[2]]] }],
    // 1 boost + 1 wall + a spare each, deepened like every other floor
    loadout: {
      bomb: Math.min(9, 2 + Math.floor(deep / 16)),
      dynamite: Math.min(9, 2 + Math.floor(deep / 20)),
      landmine: Math.min(9, 2 + Math.floor(deep / 12)),
      timebomb: Math.min(9, 2 + Math.floor(deep / 12)),
      remote: Math.min(9, 2 + Math.floor(deep / 12)),
      stick: Math.min(9, 2 + Math.floor(deep / 14)),
    },
    grid: g.map(row => row.join('')),
  };
}

/* ============================================================
   THE BOMB BUDGET — what makes every floor a little puzzle.
   Walk the floor from S to X like a careful planner: stepping onto a
   fresh platform patch costs ONE Bomb (the boost), punching into a
   fresh cracked-wall patch costs ONE Dynamite (the blast) — and tiles
   of the same patch are covered by that one spend. The cheapest route
   tells us what the floor truly DEMANDS, and your pack is exactly the
   demand plus one spare each. Hard floors with lots of platforms hand
   you a big pack; easy floors keep you honest.
   ============================================================ */
function bombNeeds(rows) {
  const H = rows.length, W = rows[0].length;
  const at = (x, y) => (rows[y] && rows[y][x]) || '#';
  let sx = 1, sy = 1, gx = W - 2, gy = 1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (at(x, y) === 'S') { sx = x; sy = y; }
    if (at(x, y) === 'X') { gx = x; gy = y; }
  }
  // Dijkstra with tiny costs, bucketed by total bombs+dynamite spent
  const seen = new Map();
  const buckets = [[[sx, sy, 0, 0]]];
  seen.set(sx + ',' + sy, 0);
  for (let spend = 0; spend < buckets.length && spend < 40; spend++) {
    const bucket = buckets[spend] || [];
    for (let i = 0; i < bucket.length; i++) {
      const [x, y, b, d] = bucket[i];
      const k0 = x + ',' + y;
      if ((seen.has(k0) ? seen.get(k0) : Infinity) < b + d) continue;
      if (x === gx && y === gy) return { bombs: b, dynamite: d };
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, c = at(nx, ny);
        if (c === '#') continue;
        const from = at(x, y);
        let nb = b, nd = d;
        if (c === 'P' && from !== 'P') nb++;
        if (c === '%' && from !== '%') nd++;
        const key = nx + ',' + ny, tot = nb + nd;
        if ((seen.has(key) ? seen.get(key) : Infinity) <= tot) continue;
        seen.set(key, tot);
        (buckets[tot] = buckets[tot] || []).push([nx, ny, nb, nd]);
      }
    }
  }
  return { bombs: 1, dynamite: 1 };   // never happens — every floor is checked finishable
}

/* build a floor: try a few layouts and keep the longest good one */
function makeFloor(n) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const got = buildFloor(n, attempt);
    if (!got) continue;
    if (!best || got.pathLen > best.pathLen) best = got;
    // a good long walk? take it
    if (best.pathLen >= (best.def.grid[0].length + best.def.grid.length) * 1.25) break;
  }
  return best ? best.def : linearFloor(n);
}
for (let n = 4; n <= 50; n++) FLOORS.push(makeFloor(n));

/* ---------- sound (best-effort, never blocks the game) ----------
   Every bomb has its own fuse and its own bang, and every weapon has its
   own swing, so you can tell what you're holding with your eyes shut. */
const sfx = {
  ctx: null, out: null, musicOut: null, muted: false, log: [],
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      this.ctx = new C();
      this.out = this.ctx.createGain();
      this.out.gain.value = this.muted ? 0 : 1;
      this.out.connect(this.ctx.destination);
      this.musicOut = this.ctx.createGain();
      this.musicOut.gain.value = this.muted ? 0 : 0.5;
      this.musicOut.connect(this.ctx.destination);
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = !!m;
    try {
      if (this.out) this.out.gain.value = this.muted ? 0 : 1;
      if (this.musicOut) this.musicOut.gain.value = this.muted ? 0 : 0.5;
    } catch (e) {}
  },
  mark(n) { this.log.push(n); if (this.log.length > 80) this.log.shift(); },
  env(type, f0, f1, dur, vol, when) {
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime + (when || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(this.out || this.ctx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  },
  noise(dur, vol, f0, when) {
    if (!this.ctx) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = f0;
      const g = this.ctx.createGain(); g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(this.out || this.ctx.destination);
      src.start(this.ctx.currentTime + (when || 0));
    } catch (e) {}
  },

  /* ---- weapons: one swing each ---- */
  swingFor(shape) {
    this.mark('swing:' + shape);
    switch (shape) {
      case 'dagger':     this.env('triangle', 940, 430, .07, .12); break;
      case 'cleaver':    this.env('triangle', 320, 120, .15, .17); this.noise(.1, .13, 900); break;
      case 'spear':      this.env('sine', 720, 300, .1, .11); this.noise(.08, .08, 3200); break;
      case 'hammer':     this.env('sine', 210, 70, .2, .2); this.noise(.14, .16, 500); break;
      case 'greatblade': this.env('triangle', 430, 130, .23, .17); this.noise(.17, .1, 1400); break;
      case 'scythe':     this.noise(.2, .15, 2600); this.env('triangle', 620, 200, .18, .1); break;
      case 'bolt':       this.env('sawtooth', 1250, 300, .12, .12); this.env('square', 2000, 800, .08, .06, .02); break;
      case 'orb':        this.env('sine', 520, 1200, .16, .1); this.env('sine', 1200, 620, .12, .06, .06); break;
      case 'fused':      this.env('triangle', 520, 190, .13, .14); this.env('sine', 900, 1700, .14, .07, .03); this.noise(.1, .1, 2400); break;
      case 'fist':       this.noise(.07, .09, 900); break;
      default:           this.env('triangle', 500, 190, .1, .12);
    }
  },
  hitFor(shape) {
    this.mark('hit:' + shape);
    if (shape === 'hammer' || shape === 'cleaver') { this.env('square', 150, 60, .16, .18); this.noise(.1, .14, 420); }
    else if (shape === 'dagger') this.env('square', 330, 140, .08, .14);
    else if (shape === 'bolt') this.env('sawtooth', 900, 200, .12, .14);
    else if (shape === 'fused') { this.env('square', 260, 90, .13, .16); this.env('sine', 1400, 700, .1, .06, .02); }
    else this.env('square', 210, 90, .12, .16);
  },

  /* ---- bombs: one fuse and one bang each ---- */
  fuseFor(type) {
    this.mark('fuse:' + type);
    switch (type) {
      case 'dynamite': this.env('sawtooth', 300, 520, .18, .08); this.noise(.25, .1, 2600); break;
      case 'landmine': this.env('square', 1400, 900, .05, .1); this.env('square', 900, 1500, .05, .08, .07); break;
      case 'timebomb': this.env('sine', 1500, 1500, .05, .1); this.env('sine', 1800, 1800, .04, .07, .09); break;
      case 'remote':   this.env('sine', 700, 1300, .09, .09); this.env('sine', 1300, 700, .09, .06, .1); break;
      case 'stick':    this.noise(.12, .18, 1200); this.env('sine', 200, 700, .12, .1); break;
      default:         this.env('sine', 900, 1150, .1, .07);
    }
  },
  boomFor(type) {
    this.mark('boom:' + type);
    switch (type) {
      case 'dynamite': this.noise(.85, .55, 380); this.env('sine', 110, 28, .9, .4); this.env('sawtooth', 70, 24, .7, .16); break;
      case 'landmine': this.noise(.3, .5, 2400); this.env('square', 320, 60, .22, .3); break;
      case 'timebomb': this.env('square', 1200, 1200, .06, .12); this.noise(.5, .45, 700); this.env('sine', 150, 40, .5, .32); break;
      case 'remote':   this.env('sine', 1700, 400, .07, .1); this.noise(.5, .45, 900); this.env('sine', 140, 40, .5, .32); break;
      case 'stick':    this.noise(.4, .45, 1600); this.env('sine', 330, 60, .3, .28); break;
      default:         this.noise(.55, .5, 500); this.env('sine', 130, 40, .5, .35);
    }
  },
  tick() { this.mark('tick'); this.env('square', 1800, 1800, .03, .07); },
  armed() { this.mark('armed'); this.env('square', 1200, 1650, .05, .08); },
  zap() { this.mark('zap'); this.env('square', 1900, 300, .12, .13); this.env('sawtooth', 700, 2400, .06, .07, .02); },
  slam() { this.mark('slam'); this.env('sine', 150, 40, .3, .28); this.noise(.16, .2, 420); },
  beam() { this.mark('beam'); this.env('sawtooth', 2400, 180, .5, .16); this.env('square', 120, 50, .55, .15, .05); this.noise(.4, .18, 2400); },
  detonator() { this.mark('detonator'); this.env('square', 500, 950, .05, .12); this.env('square', 950, 500, .04, .08, .05); },

  /* ---- everything else ---- */
  swing() { this.swingFor('blade'); },
  hit() { this.hitFor('blade'); },
  fuse() { this.fuseFor('bomb'); },
  boom() { this.boomFor('bomb'); },
  hurt() { this.mark('hurt'); this.env('sawtooth', 180, 60, .3, .2); },
  pickup() { this.mark('pickup'); this.env('sine', 660, 990, .14, .15); },
  gem() { this.mark('gem'); this.env('sine', 990, 1320, .12, .12); },
  boost() { this.mark('boost'); this.env('sine', 250, 720, .32, .2); },
  stairs() { this.mark('stairs'); [523, 659, 784, 1047].forEach((f, i) => this.env('sine', f, f, .25, .18, i * .13)); },
  die() { this.mark('die'); this.env('sawtooth', 220, 40, .8, .25); },
};

    this.ctx = ctx;
    this.out = out || ctx.destination;
    this.on = true;
    this.step = 0; this.bar = 0;

  stop() { this.on = false; clearInterval(this.timer); this.timer = null; },
  setMood(m) { if (this.LEAD[m] && m !== this.mood) { this.mood = m; } },
  stepDur() { return 60 / this.BPM[this.mood] / 4; },
  tick() {
    if (!this.on || !this.ctx) return;
    try {
      while (this.next < this.ctx.currentTime + 0.15) {
        this.play(this.step, this.next);
        this.next += this.stepDur();
        this.step++;
        if (this.step % 16 === 0) this.bar++;

    } catch (e) { this.stop(); }
  },
  tone(f, t, dur, type, vol, glideTo) {
    if (!f) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.02);
  },
  drum(t, kind) {
    if (kind === 'kick') {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.13);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(this.out); o.start(t); o.stop(t + 0.18);

    }
    // snare / hat: filtered noise
    const dur = kind === 'snare' ? 0.16 : 0.045;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, kind === 'snare' ? 1.6 : 3);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = kind === 'snare' ? 'bandpass' : 'highpass';
    f.frequency.value = kind === 'snare' ? 1600 : 7000;
    const g = this.ctx.createGain(); g.gain.value = kind === 'snare' ? 0.26 : 0.1;
    src.connect(f); f.connect(g); g.connect(this.out);
    src.start(t);
  },
  play(step, t) {
    const s = step % 16, barInLoop = Math.floor(step / 16) % 4;
    const mood = this.mood;
    const root = this.ROOTS[barInLoop];
    const busy = mood !== 'calm';

    if (s === 0 || s === 8 || (busy && s === 14)) this.drum(t, 'kick');
    if (s === 4 || s === 12) this.drum(t, 'snare');
    if (busy && s % 2 === 0) this.drum(t, 'hat');
    if (mood === 'battle' && s % 2 === 1) this.drum(t, 'hat');
    // bass: root, with a bouncing octave to keep it moving
    if (s % 4 === 0) this.tone(root, t, 0.2, 'triangle', 0.22);
    else if (busy && s % 4 === 2) this.tone(root * 2, t, 0.12, 'triangle', 0.13);
    // the hook (every other loop it jumps an octave, so it doesn't get boring)
    const lead = this.LEAD[mood][barInLoop][s];
    if (lead) {
      const high = Math.floor(step / 64) % 2 === 1 && mood !== 'battle';
      this.tone(lead * (high ? 2 : 1), t, mood === 'calm' ? 0.3 : 0.15, 'square', 0.1);
      this.tone(lead * (high ? 2 : 1) * 1.005, t, mood === 'calm' ? 0.3 : 0.15, 'sawtooth', 0.035);
    }
  },
};

function parseFloor(def) {
  const rows = def.grid;
  const W = rows[0].length, H = rows.length;
  rows.forEach(r => { if (r.length !== W) console.error('BAD ROW LENGTH', r); });
  const tiles = [], enemies = [], crates = [];
  let start = { x: 1.5, y: 1.5 }, stairs = { x: W - 2, y: 1 };
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      const ch = rows[y][x];
      let kind = 'floor';
      if (ch === '#') kind = 'wall';
      else if (ch === '%') kind = 'crack';
      else if (ch === 'c') kind = 'carpet';
      else if (ch === 'P') kind = 'plat';
      else if (ch === '^') kind = 'spike';
      else if (ch === 'X') { kind = 'stairs'; stairs = { x: x + 0.5, y: y + 0.5 }; }
      else if (ch === 'S') { start = { x: x + 0.5, y: y + 0.5 }; }
      else if (ch === 'z' || ch === 'k') enemies.push({ kind: ch === 'z' ? 'zombie' : 'skeleton', x: x + 0.5, y: y + 0.5 });
      else if (ch === 'b') crates.push({ x: x + 0.5, y: y + 0.5 });
      row.push({ kind, spikePhase: (x * 7 + y * 13) % 10 / 10 * 1.8 });
    }
    tiles.push(row);
  }
  // torches: mounted on wall tiles that face open floor (south/east faces), spaced out
  const torches = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (tiles[y][x].kind !== 'wall' && tiles[y][x].kind !== 'crack') continue;
    const south = tiles[y + 1] && !isSolidKind(tiles[y + 1][x].kind);
    const east = tiles[y][x + 1] && !isSolidKind(tiles[y][x + 1].kind);
    if ((south || east) && rand(x * 31 + y * 17) < 0.24) {
      torches.push({ x: x + 0.5, y: y + 0.5, side: south ? 's' : 'e', seed: x * 7 + y });
    }
  }
  // chains: hang from the unseen ceiling over open floor, scattered
  const chains = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (isSolidKind(tiles[y][x].kind)) continue;
    if (rand(x * 13 + y * 29 + 5) < 0.05) chains.push({ x: x + 0.5, y: y + 0.5, len: 60 + rand(x + y) * 60, phase: rand(x * 3 + y) * 6.28, seed: x + y * 31 });
  }

}

/* ---------- the bomb ring ----------

let ringOpen = false, ringOpenedAt = 0;
function buildRing() {

    const a = -Math.PI / 2 + i * (Math.PI * 2 / BOMB_ORDER.length);
    const x = Math.round(Math.cos(a) * R), y = Math.round(Math.sin(a) * R);
    const sel = t === G.hero.sel;
    return '<button class="rslot' + (sel ? ' sel' : '') + (have ? '' : ' dim') + '" data-type="' + t + '"' +
      ' style="--rt:translate(' + x + 'px,' + y + 'px)' + (sel ? ' scale(1.13)' : '') + ';transform:var(--rt)">' +
      '<span class="ricon">' + BOMB_ICONS[t] + '</span>' +
      '<span class="rname">' + T.name + '</span>' +
      '<span class="rcount">' + (have ? '×' + (G.hero.belt[t] || 0) : '&#128274;') + '</span>' +
    '</button>';
  }).join('') + '<button class="rclose" aria-label="Close">&#10005;</button>';

  const h = G.hero;

/* ---------- movement & collision ---------- */
function heroPassable(x, y, h) {
  const t = tileAt(x, y);
  if (!t) return false;
  if (isSolidKind(t.kind)) return false;
  if (t.kind === 'plat' && h.elev < 1 && !h.boosting) return false;   // can't climb up
  return true;
}
function tileAt(x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  return (G.tiles[ty] && G.tiles[ty][tx]) || null;
}
function moveHero(h, dx, dy) {
  // leading-edge collision: only the corners on the side you're moving toward
  // block you. If just ONE corner clips a wall, slide around it (corner assist)
  // so movement feels smooth instead of snaggy.
  const R = 0.28;
  if (dx) {
    const nx = h.fx + dx, lead = nx + Math.sign(dx) * R;
    const top = heroPassable(lead, h.fy - R, h), bot = heroPassable(lead, h.fy + R, h);
    if (top && bot) h.fx = nx;
    else if (top !== bot) {
      const push = Math.abs(dx) * 0.85, dir = top ? -1 : 1;
      const ny = h.fy + push * dir, ylead = ny + dir * R;
      if (heroPassable(h.fx - R, ylead, h) && heroPassable(h.fx + R, ylead, h)) h.fy = ny;
    }
  }
  if (dy) {
    const ny = h.fy + dy, lead = ny + Math.sign(dy) * R;
    const lft = heroPassable(h.fx - R, lead, h), rgt = heroPassable(h.fx + R, lead, h);
    if (lft && rgt) h.fy = ny;
    else if (lft !== rgt) {
      const push = Math.abs(dy) * 0.85, dir = lft ? -1 : 1;
      const nx = h.fx + push * dir, xlead = nx + dir * R;
      if (heroPassable(xlead, h.fy - R, h) && heroPassable(xlead, h.fy + R, h)) h.fx = nx;
    }
  }
}
function enemyPassable(x, y) {
  const t = tileAt(x, y);
  return t && !isSolidKind(t.kind) && t.kind !== 'plat';
}
function moveEnemy(e, dx, dy) {
  const R = 0.3;
  if (dx) {
    const lead = e.fx + dx + Math.sign(dx) * R;
    if (enemyPassable(lead, e.fy - R) && enemyPassable(lead, e.fy + R)) e.fx += dx;
  }
  if (dy) {
    const lead = e.fy + dy + Math.sign(dy) * R;
    if (enemyPassable(e.fx - R, lead) && enemyPassable(e.fx + R, lead)) e.fy += dy;
  }
}

/* ---------- actions ---------- */
function heroAttack() {
  const h = G.hero, now = performance.now();
  if (G.over || h.dead || ringOpen || now < h.attackReadyAt) return;
  sfx.init();
  h.attackReadyAt = now + 380;
  h.swingUntil = now + 180;
  sfx.swingFor(heroShape);
  h.swingN = (h.swingN || 0) + 1;
  const reach = 1.7 + 0.25 * enchLv('edge');   // Edge of Doom: the weapon reaches further
  const arc = 2.1;
  // Ending Flourish: every 4th swing is a downward SMASH — splash damage all around you
  const smashing = enchLv('flourish') > 0 && h.swingN % 4 === 0;
  if (smashing) {
    G.slams.push({ fx: h.fx, fy: h.fy, at: now, r: reach + 0.3 });
    shake(); sfx.slam();
    floatText(h.fx, h.fy, 'SMASH!', '#ffd23f');
  }
  // Trail Blazer: the swing itself splashes fire on the ground in front of you
  if (enchLv('trail')) layFireTrail(enchLv('trail'), now);
  G.enemies.forEach(e => {
    if (e.dead || e.elevOnly) return;
    const d = dist(h.fx, h.fy, e.fx, e.fy);
