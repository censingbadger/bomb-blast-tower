<!-- Bomb Blast Tower — THE TOWER (the game!)
     An isometric 2.5D action crawler in the spirit of Back Stab's dungeon
     mode (Jing & Ash Games): WASD/arrows or touch joystick to move,
     K / click / ATTACK to swing, SPACE to hop, B to drop a bomb.
     You climb the tower floor by floor: dark dank halls with torches,
     red carpets and hanging chains; walls block your way (bomb the cracked
     ones), platforms need a bomb-boost to reach, spikes and monsters wait.
     Die and the floor resets. Reach the staircase: VICTORY — you beat this
     floor — then you're teleported home, ready to start the next one.
     Floor progress and gems share localStorage with the Market. -->

:root {
  --ink: #f0e8d8;
  --dim: #9b8f7c;
  --wood: #b06f34;
  --wood-dark: #7a4a1f;
  --blood: #a71d2a;
  --gem: #3ec6ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
  background: #0b0812;
  color: var(--ink);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
#game { position: fixed; inset: 0; display: block; }

/* ---------- HUD ---------- */
.hud {
  position: fixed;
  top: max(.6rem, env(safe-area-inset-top));
  left: .8rem; right: .8rem;
  display: flex;
  align-items: flex-start;
  gap: .9rem;
  pointer-events: none;
  z-index: 10;
}
.hud .chip {
  display: flex; align-items: center; gap: .4rem;
  background: rgba(12,8,18,.72);
  border: 2px solid #3a3046;
  border-radius: 999px;
  padding: .35rem .8rem .25rem;
  font-family: 'Luckiest Guy', cursive;
  font-size: 1.05rem;
  letter-spacing: .04em;
}
.hud .hearts { font-size: 1.2rem; letter-spacing: .06em; color: #ff4d5e; }
.hud .hearts .half { color: #ff9d5e; }
.hud .hearts .empty { color: #4a3a46; }
.hud svg { width: 1.05em; height: auto; }
#bombchip svg { width: 1.3em; }
.floorname {
  margin: 0 auto;
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: var(--ink);
  text-shadow: 0 2px 0 #000, 0 0 18px rgba(255,140,26,.35);
  background: rgba(12,8,18,.55);
  border: 2px solid #3a3046;
  border-radius: 999px;
  padding: .4rem 1.1rem .25rem;
}
.quit {
  pointer-events: auto;
  font-family: 'Luckiest Guy', cursive;
  font-size: .95rem;
  color: var(--ink);
  background: rgba(12,8,18,.72);
  border: 2px solid #3a3046;
  border-radius: 999px;
  padding: .4rem .9rem .25rem;
  cursor: pointer;
  text-decoration: none;
}
.quit:hover { border-color: #6b5c80; }

/* ---------- touch controls ---------- */
.tc { position: fixed; bottom: max(1rem, env(safe-area-inset-bottom)); z-index: 10; }
#joyzone { left: 0; width: 46vw; height: 42vh; bottom: 0; position: fixed; z-index: 9; }
#joy {
  left: 4.5vw; width: 108px; height: 108px;
  border-radius: 50%;
  background: rgba(255,255,255,.05);
  border: 2px solid rgba(255,255,255,.14);
  display: none;
}
#joy .knob {
  position: absolute; left: 50%; top: 50%;
  width: 48px; height: 48px; margin: -24px 0 0 -24px;
  border-radius: 50%;
  background: rgba(255,255,255,.22);
  border: 2px solid rgba(255,255,255,.3);
}
.tbtns { right: 3vw; display: none; flex-direction: column; gap: .7rem; align-items: flex-end; }
.tbtn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,.28);
  background: rgba(20,14,30,.66);
  color: var(--ink);
  font-family: 'Luckiest Guy', cursive;
  font-size: .78rem;
  letter-spacing: .04em;
  display: grid; place-items: center;
  cursor: pointer;
}
.tbtn.big { width: 76px; height: 76px; font-size: .9rem; border-color: rgba(255,120,90,.55); }
.touch .tbtns { display: flex; }
.touch #joy { display: block; position: fixed; bottom: 7vh; }

/* ---------- banners & overlays ---------- */
#banner {
  position: fixed;
  left: 50%; top: 34%;
  transform: translate(-50%, -50%) scale(.9);
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(1.6rem, 6vw, 3rem);
  color: #ffd23f;
  text-shadow: 0 3px 0 #5b3a00, 0 0 30px rgba(255,140,26,.5);
  letter-spacing: .06em;
  opacity: 0;
  pointer-events: none;
  z-index: 15;
  text-align: center;
  white-space: nowrap;
}
#banner.show { animation: bannerpop 1.6s ease forwards; }
@keyframes bannerpop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
  22% { transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
}
.overlay {
  position: fixed; inset: 0;
  background: rgba(5,3,10,.78);
  display: none;
  align-items: center; justify-content: center;
  z-index: 20;
  text-align: center;
}
.overlay.show { display: flex; }
.overlay .panel {
  padding: 2rem 2.4rem;
  max-width: 92vw;
}
.overlay h1 {
  font-family: 'Luckiest Guy', cursive;
  font-size: clamp(2.2rem, 8vw, 4rem);
  letter-spacing: .05em;
  margin-bottom: .4rem;
}
#death h1 { color: #ff4d5e; text-shadow: 0 4px 0 #4a000a, 0 0 40px rgba(255,60,80,.4); }
#victory h1 { color: #ffd23f; text-shadow: 0 4px 0 #5b3a00, 0 0 40px rgba(255,200,60,.45); }
.overlay p { font-size: 1.35rem; color: var(--ink); margin-bottom: 1.1rem; }
.overlay .sub { font-size: 1.05rem; color: var(--dim); }
.overlay .btn {
  font-family: 'Luckiest Guy', cursive;
  font-size: 1.15rem;
  letter-spacing: .05em;
  color: #fff6e3;
  background: linear-gradient(180deg, #c07d3d, #b06f34);
  border: 3px solid var(--wood-dark);
  border-radius: 999px;
  padding: .7rem 1.7rem .5rem;
  cursor: pointer;

<script>
/* ============================================================
   FLOORS — each floor is a tile grid. Legend:
   #  wall          %  cracked wall (bombable)
   .  stone floor   c  red carpet
   P  raised platform (bomb-boost to get up; walk off to drop)
   ^  spike trap    b  bomb crate (+3 bombs)
   S  hero start    X  the staircase up (goal)
   z  zombie        k  skeleton (faster)
   ============================================================ */
const FLOORS = [
  {
    name: 'FLOOR 1 — The Guardroom',
    tip: 'Bomb the cracked wall! (B)',
    loadout: { bomb: 3 },
    grid: [
      '####################',
      '#S....#........#...#',

      '#..b..c..z...c.#kPP#',
      '#.....cccc...c.%..b#',
      '####################',
    ],
  },
  {
    name: 'FLOOR 2 — The Spike Bridge',
    tip: 'NEW: dynamite & landmines — press V to swap bombs!',
    loadout: { bomb: 2, dynamite: 2, landmine: 2 },
    grid: [
      '######################',
      '#S...#....#..........#',
      '#.c..#.z..%..z...#...#',
      '#.c..#....#......#.k.#',
      '#.cc.##.###^^^^^.#...#',
      '#..c......#^PPP^.##.##',
      '#b.c......#^PPP^..#..#',
      '#..cc.z...#^PPP^..#.X#',
      '#...c.....#^^^^^..#.c#',
      '#...cccc..#.......%cc#',
      '#......c..#...k...#..#',
      '#..##..cc.#.......#..#',
      '#..#b...c.#..###..#..#',
      '#..#....c.....#...#..#',
      '######################',
    ],
  },
  {
    name: 'FLOOR 3 — The Chained Hall',
    tip: 'NEW: time bombs (T sets), remote bombs (R!) & stick bombs!',
    loadout: { bomb: 2, dynamite: 2, landmine: 2, timebomb: 2, remote: 2, stick: 3 },
    grid: [
      '########################',
      '#S.....#....z...#......#',
      '#.cccc.%.cccccc.%.ccc..#',
      '#....c.#.c....c.#...c..#',
      '#..z.c.#.c.^^.c.#.k.c..#',
      '#....c.#.c.^^.c.#...c..#',
      '#.b..c.#.c....c.#...c..#',
      '####.c.#.cc..kc.#.####.#',
      '#....c.#..c...c.#....#.#',
      '#.cccc.##.ccc.c.##...#.#',
      '#.c.......#...c..#.z.#.#',
      '#.c.^^^...#...cc.#...#X#',
      '#.c.^P^...#....c.#..PP.#',
      '#.c.^P^...#.z..c.#..PP.#',
      '#.ccc.....#....cc%...b.#',
      '#.....b...#............#',
      '########################',
    ],
  },
];

/* The six bombs, straight from the drawings. boost: 'up' | 'side' | 'diag' */
const BOMB_TYPES = {
  bomb:     { name: 'Bomb',        fuse: 1150, radius: 1.9, dmg: 3, breaksWalls: true, boost: 'up',
              desc: 'boosts upwards' },
  dynamite: { name: 'Dynamite',    fuse: 1400, radius: 2.7, dmg: 5, breaksWalls: true, boost: null,
              desc: 'DESTROYS blocks' },
  landmine: { name: 'Landmine',    mine: true, arm: 800, radius: 1.6, dmg: 3, breaksWalls: true, boost: 'side',
              desc: 'explodes when touched — boosts sideways' },
  timebomb: { name: 'Time Bomb',   settable: true, radius: 2.0, dmg: 3, breaksWalls: true, boost: 'up',
              desc: 'you set the timer (T)' },
  remote:   { name: 'Remote Bomb', remote: true, radius: 2.0, dmg: 3, breaksWalls: true, boost: 'up',
              desc: 'R presses the button' },
  stick:    { name: 'Stick Bomb',  fuse: 1000, radius: 1.7, dmg: 3, breaksWalls: true, boost: 'diag', sticky: true,
              desc: 'sticks to things — boosts diagonally' },
};
const BOMB_ORDER = ['bomb', 'dynamite', 'landmine', 'timebomb', 'remote', 'stick'];
const BOMB_ICONS = {
  bomb: '<svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="7" fill="#26262f" stroke="#f0e8d8" stroke-width="1.6"/><path d="M12 8 C11 5.5 14 5 13.5 3" fill="none" stroke="#a9743c" stroke-width="1.8"/><path d="M13.5 3 l2 -1.4" stroke="#ff8c1a" stroke-width="1.8"/></svg>',
  dynamite: '<svg viewBox="0 0 24 24"><rect x="5" y="8" width="4" height="13" rx="1.6" fill="#b3402a"/><rect x="10" y="6" width="4" height="15" rx="1.6" fill="#c9532f"/><rect x="15" y="8" width="4" height="13" rx="1.6" fill="#b3402a"/><path d="M12 6 C11.5 4 13.5 3.5 13 2" fill="none" stroke="#a9743c" stroke-width="1.6"/><rect x="4.5" y="13" width="15" height="2.4" fill="#6b3a1a"/></svg>',
  landmine: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="9" ry="4.5" fill="#6a7280" stroke="#3a4048" stroke-width="1.5"/><ellipse cx="12" cy="13.5" rx="4.5" ry="2.2" fill="#8d959d"/><circle cx="12" cy="13" r="1.6" fill="#e33"/></svg>',
  timebomb: '<svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2" fill="#33333e" stroke="#111" stroke-width="1.4"/><rect x="7" y="11" width="10" height="5" rx="1" fill="#dff3e0"/><path d="M9 13.5 h6" stroke="#1a7a2a" stroke-width="1.8"/><path d="M12 8 V5" stroke="#a9743c" stroke-width="1.6"/></svg>',
  remote: '<svg viewBox="0 0 24 24"><circle cx="10" cy="16" r="6" fill="#26262f" stroke="#f0e8d8" stroke-width="1.5"/><path d="M13 11 L18 4" stroke="#8d959d" stroke-width="1.8"/><circle cx="18.5" cy="3.5" r="2" fill="#e33"/></svg>',
  stick: '<svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="7.5" fill="#3c6e33" stroke="#1e3a18" stroke-width="1.5"/><path d="M6 11 h12 M6 17 h12 M9 7.5 v13 M15 7.5 v13" stroke="#1e3a18" stroke-width="1.2" fill="none"/><circle cx="16" cy="5" r="2.4" fill="none" stroke="#c9ced6" stroke-width="1.6"/></svg>',
};

const ENEMY_KINDS = {
  zombie:   { hp: 3, speed: 1.25, aggro: 5.5, dmg: 1, swipeCool: 1150, gems: 4, body: '#5da24e', cloth: '#3c6e33', eye: '#d0ffb0' },
  skeleton: { hp: 2, speed: 2.05, aggro: 6.5, dmg: 1, swipeCool: 950,  gems: 3, body: '#e8e4da', cloth: '#8d959d', eye: '#222' },
};

/* ============================================================ */
const ISO = { TW: 64, TH: 32 };
const WALL_H = 46, PLAT_H = 26;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = s => document.querySelector(s);

const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rand = seed => { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const isoX = (fx, fy) => (fx - fy) * (ISO.TW / 2);
const isoY = (fx, fy) => (fx + fy) * (ISO.TH / 2);

/* ---------- sound (best-effort, never blocks the game) ---------- */
const sfx = {
  ctx: null,
  init() { if (this.ctx) return; try { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); } catch (e) {} },
  env(type, f0, f1, dur, vol) {
    if (!this.ctx) return;
    try {
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  },
  noise(dur, vol, f0) {
    if (!this.ctx) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const src = this.ctx.createBufferSource(); src.buffer = buf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = f0;
      const g = this.ctx.createGain(); g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(this.ctx.destination);
      src.start();
    } catch (e) {}
  },
  swing() { this.env('triangle', 500, 190, .1, .12); },
  hit() { this.env('square', 210, 90, .12, .16); },
  hurt() { this.env('sawtooth', 180, 60, .3, .2); },
  fuse() { this.env('sine', 900, 1150, .1, .07); },
  boom() { this.noise(.55, .5, 500); this.env('sine', 130, 40, .5, .35); },
  pickup() { this.env('sine', 660, 990, .14, .15); },
  gem() { this.env('sine', 990, 1320, .12, .12); },
  boost() { this.env('sine', 250, 720, .32, .2); },
  stairs() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.env('sine', f, f, .25, .18), i * 130)); },
  die() { this.env('sawtooth', 220, 40, .8, .25); },
};

/* ---------- game state ---------- */
let G = null;                 // current floor run
const floorParam = new URLSearchParams(location.search).get('floor');
const savedFloor = load('bbt-floor', 1);
const floorNum = clamp(parseInt(floorParam || savedFloor, 10) || 1, 1, FLOORS.length);
let gems = load('bbt-gems', 173);

function parseFloor(def) {
  const rows = def.grid;
  const W = rows[0].length, H = rows.length;
  rows.forEach(r => { if (r.length !== W) console.error('BAD ROW LENGTH', r); });
  const tiles = [], enemies = [], crates = [];
  let start = { x: 1.5, y: 1.5 }, stairs = { x: W - 2, y: 1 };
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      const ch = rows[y][x];
      let kind = 'floor';
      if (ch === '#') kind = 'wall';
      else if (ch === '%') kind = 'crack';
      else if (ch === 'c') kind = 'carpet';
      else if (ch === 'P') kind = 'plat';
      else if (ch === '^') kind = 'spike';
      else if (ch === 'X') { kind = 'stairs'; stairs = { x: x + 0.5, y: y + 0.5 }; }
      else if (ch === 'S') { start = { x: x + 0.5, y: y + 0.5 }; }
      else if (ch === 'z' || ch === 'k') enemies.push({ kind: ch === 'z' ? 'zombie' : 'skeleton', x: x + 0.5, y: y + 0.5 });
      else if (ch === 'b') crates.push({ x: x + 0.5, y: y + 0.5 });
      row.push({ kind, spikePhase: (x * 7 + y * 13) % 10 / 10 * 1.8 });
    }
    tiles.push(row);
  }
  // torches: mounted on wall tiles that face open floor (south/east faces), spaced out
  const torches = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (tiles[y][x].kind !== 'wall' && tiles[y][x].kind !== 'crack') continue;
    const south = tiles[y + 1] && !isSolidKind(tiles[y + 1][x].kind);
    const east = tiles[y][x + 1] && !isSolidKind(tiles[y][x + 1].kind);
    if ((south || east) && rand(x * 31 + y * 17) < 0.24) {
      torches.push({ x: x + 0.5, y: y + 0.5, side: south ? 's' : 'e', seed: x * 7 + y });
    }
  }
  // chains: hang from the unseen ceiling over open floor, scattered
  const chains = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (isSolidKind(tiles[y][x].kind)) continue;
    if (rand(x * 13 + y * 29 + 5) < 0.05) chains.push({ x: x + 0.5, y: y + 0.5, len: 60 + rand(x + y) * 60, phase: rand(x * 3 + y) * 6.28, seed: x + y * 31 });
  }
  return { W, H, tiles, start, stairs, enemySpawns: enemies, crateSpawns: crates, torches, chains };
}
function isSolidKind(k) { return k === 'wall' || k === 'crack'; }

function startFloor() {
  const def = FLOORS[floorNum - 1];
  const map = parseFloor(def);
  G = {
    def, ...map,
    hero: {
      fx: map.start.x, fy: map.start.y, elev: 0,
      hearts: 6, maxHearts: 6,            // half-hearts (3 full)
      belt: Object.assign({}, def.loadout || { bomb: 3 }),
      sel: 'bomb',
      facing: 1, faceAngle: 0,
      moving: false, step: 0,
      swingUntil: 0, attackReadyAt: 0,
      jumpZ: 0, jumpUntil: 0, boosting: false, boostUntil: 0, boostFrom: 0,
      hurtUntil: 0, iframesUntil: 0, spikeHurtAt: 0,
      dead: false,
    },
    enemies: map.enemySpawns.map((e, i) => ({
      ...ENEMY_KINDS[e.kind], kind: e.kind,
      fx: e.x, fy: e.y, homeX: e.x, homeY: e.y,
      hp: ENEMY_KINDS[e.kind].hp, facing: 1,
      swipeReadyAt: 0, swingUntil: 0, hurtUntil: 0,
      dead: false, deadAt: 0, seed: i * 3 + 1, wanderAt: 0, wx: e.x, wy: e.y,
    })),
    crates: map.crateSpawns.map(c => ({ ...c, taken: false })),
    bombs: [], booms: [], floats: [], rubble: [], sparkles: [],
    keys: {}, joy: { active: false, dx: 0, dy: 0 },
    timerSetting: 3000,
    cam: { x: map.start.x, y: map.start.y },
    shakeUntil: 0, over: false, won: false,
    t0: performance.now(),
  };
  // owning the Market's Box-o-Bombs adds +3 bombs every floor
  try { if ((load('bbt-owned', []) || []).includes('bombs')) G.hero.belt.bomb = (G.hero.belt.bomb || 0) + 3; } catch (e) {}
  $('#floorname').textContent = def.name;
  updateHUD();
  banner(def.name.replace(' — ', ' — ').toUpperCase(), 1900);
  setTimeout(() => { if (G && !G.over) banner(def.tip, 1700); }, 2100);
}

/* ---------- HUD ---------- */
function updateHUD() {
  const h = G.hero;
  let s = '';
  for (let i = 0; i < h.maxHearts; i += 2) {
    const v = h.hearts - i;
    s += v >= 2 ? '❤' : v >= 1 ? '<span class="half">❤</span>' : '<span class="empty">❤</span>';
  }
  $('#hearts').innerHTML = s;
  const T = BOMB_TYPES[h.sel];
  let label = T.name + ' ×' + (h.belt[h.sel] || 0);
  if (T.settable) label += ' (' + (G.timerSetting / 1000) + 's)';
  $('#bombchip').innerHTML = BOMB_ICONS[h.sel] + '<span>' + label + '</span>';
  $('#gems').textContent = gems;
}
function unlockedTypes() { return BOMB_ORDER.filter(k => k in G.hero.belt); }
function cycleBomb() {
  const u = unlockedTypes();
  if (u.length < 2) { banner('More bombs on later floors!', 1000); return; }
  G.hero.sel = u[(u.indexOf(G.hero.sel) + 1) % u.length];
  sfx.init(); sfx.pickup();
  const T = BOMB_TYPES[G.hero.sel];
  banner(T.name.toUpperCase() + ' — ' + T.desc, 1300);
  updateHUD();
}
function cycleTimer() {
  const s = [1000, 3000, 5000];
  G.timerSetting = s[(s.indexOf(G.timerSetting) + 1) % 3];
  banner('TIMER: ' + (G.timerSetting / 1000) + 's', 900);
  updateHUD();
}
function detonateRemotes() {
  let any = false;
  G.bombs.forEach(b => { if (b.remote) { b.goBoom = true; any = true; } });
  if (any) { sfx.init(); sfx.fuse(); }
}
function banner(txt, ms) {
  const b = $('#banner');
  b.textContent = txt;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
function floatText(fx, fy, txt, color) {
  G.floats.push({ fx, fy, txt, color, at: performance.now() });
}
function shake() { G.shakeUntil = performance.now() + 260; }

/* ---------- movement & collision ---------- */
function heroPassable(x, y, h) {
  const t = tileAt(x, y);
  if (!t) return false;
  if (isSolidKind(t.kind)) return false;
  if (t.kind === 'plat' && h.elev < 1 && !h.boosting) return false;   // can't climb up
  return true;
}
function tileAt(x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  return (G.tiles[ty] && G.tiles[ty][tx]) || null;
}
function moveHero(h, dx, dy) {
  // leading-edge collision: only the corners on the side you're moving toward
  // block you. If just ONE corner clips a wall, slide around it (corner assist)
  // so movement feels smooth instead of snaggy.
  const R = 0.28;
  if (dx) {
    const nx = h.fx + dx, lead = nx + Math.sign(dx) * R;
    const top = heroPassable(lead, h.fy - R, h), bot = heroPassable(lead, h.fy + R, h);
    if (top && bot) h.fx = nx;
    else if (top !== bot) {
      const push = Math.abs(dx) * 0.85, dir = top ? -1 : 1;
      const ny = h.fy + push * dir, ylead = ny + dir * R;
      if (heroPassable(h.fx - R, ylead, h) && heroPassable(h.fx + R, ylead, h)) h.fy = ny;
    }
  }
  if (dy) {
    const ny = h.fy + dy, lead = ny + Math.sign(dy) * R;
    const lft = heroPassable(h.fx - R, lead, h), rgt = heroPassable(h.fx + R, lead, h);
    if (lft && rgt) h.fy = ny;
    else if (lft !== rgt) {
      const push = Math.abs(dy) * 0.85, dir = lft ? -1 : 1;
      const nx = h.fx + push * dir, xlead = nx + dir * R;
      if (heroPassable(xlead, h.fy - R, h) && heroPassable(xlead, h.fy + R, h)) h.fx = nx;
    }
  }
}
function enemyPassable(x, y) {
  const t = tileAt(x, y);
  return t && !isSolidKind(t.kind) && t.kind !== 'plat';
}
function moveEnemy(e, dx, dy) {
  const R = 0.3;
  if (dx) {
    const lead = e.fx + dx + Math.sign(dx) * R;
    if (enemyPassable(lead, e.fy - R) && enemyPassable(lead, e.fy + R)) e.fx += dx;
  }
  if (dy) {
    const lead = e.fy + dy + Math.sign(dy) * R;
    if (enemyPassable(e.fx - R, lead) && enemyPassable(e.fx + R, lead)) e.fy += dy;
  }
}

/* ---------- actions ---------- */
function heroAttack() {
  const h = G.hero, now = performance.now();
  if (G.over || h.dead || now < h.attackReadyAt) return;
  sfx.init();
  h.attackReadyAt = now + 380;
  h.swingUntil = now + 180;
  sfx.swing();
  const reach = 1.7, arc = 2.1;
  G.enemies.forEach(e => {
    if (e.dead) return;
    if (e.elevOnly) return;
    const a = Math.atan2(e.fy - h.fy, e.fx - h.fx);
    let da = Math.abs(a - h.faceAngle); if (da > Math.PI) da = Math.PI * 2 - da;
    if (dist(h.fx, h.fy, e.fx, e.fy) <= reach && da <= arc / 2) {
      hurtEnemy(e, 1, h);
    }
  });
}
function hurtEnemy(e, dmg, from) {
  const now = performance.now();
  e.hp -= dmg;
  e.hurtUntil = now + 180;
  sfx.hit();
  const m = dist(from.fx, from.fy, e.fx, e.fy) || 1;
  moveEnemy(e, (e.fx - from.fx) / m * 0.45, (e.fy - from.fy) / m * 0.45);
  floatText(e.fx, e.fy, '-' + dmg, '#ffd23f');
  if (e.hp <= 0 && !e.dead) {
    e.dead = true; e.deadAt = now;
    const reward = e.gems + Math.floor(Math.random() * 3);
    gems += reward; save('bbt-gems', gems);
    floatText(e.fx, e.fy, '+' + reward + ' ◆', '#3ec6ff');
    sfx.gem();
    updateHUD();
  }
}
function heroJump() {
  const h = G.hero, now = performance.now();
  if (G.over || h.dead || h.jumpZ > 0) return;
  h.jumpUntil = now + 460;
}
function placeBomb() {
  const h = G.hero, now = performance.now();
  if (G.over || h.dead) return;
  const sel = h.sel, T = BOMB_TYPES[sel];
  if ((h.belt[sel] || 0) <= 0) { banner('NO ' + T.name.toUpperCase() + 'S! Find a crate.', 1200); return; }
  sfx.init(); sfx.fuse();
  h.belt[sel]--;
  updateHUD();
  const b = { fx: h.fx, fy: h.fy, at: now, type: sel };
  if (T.settable) b.fuse = G.timerSetting;
  if (T.mine) b.armAt = now + T.arm;
  if (T.remote) b.remote = true;
  if (T.sticky) {
    // stick to the nearest monster — or to the wall you're facing
    let tgt = null, best = 1.15;
    G.enemies.forEach(e => { if (!e.dead) { const d = dist(h.fx, h.fy, e.fx, e.fy); if (d < best) { best = d; tgt = e; } } });
    if (tgt) { b.stuckTo = tgt; floatText(tgt.fx, tgt.fy, 'STUCK!', '#ffd23f'); }
    else {
      const wx = h.fx + Math.cos(h.faceAngle), wy = h.fy + Math.sin(h.faceAngle);
      const wt = tileAt(wx, wy);
      if (wt && isSolidKind(wt.kind)) { b.fx = h.fx + Math.cos(h.faceAngle) * 0.55; b.fy = h.fy + Math.sin(h.faceAngle) * 0.55; b.onWall = true; }
    }
  }
  G.bombs.push(b);
}
function explode(b) {
  const now = performance.now(), T = BOMB_TYPES[b.type];
  sfx.boom(); shake();
  G.booms.push({ fx: b.fx, fy: b.fy, at: now, radius: T.radius });
  // break cracked walls
  if (T.breaksWalls) {
    for (let y = Math.floor(b.fy - T.radius); y <= Math.floor(b.fy + T.radius); y++) {
      for (let x = Math.floor(b.fx - T.radius); x <= Math.floor(b.fx + T.radius); x++) {
        const t = (G.tiles[y] || [])[x];
        if (t && t.kind === 'crack' && dist(x + 0.5, y + 0.5, b.fx, b.fy) <= T.radius + 0.4) {
          t.kind = 'floor';
          G.rubble.push({ fx: x + 0.5, fy: y + 0.5, seed: x + y * 7 });
          floatText(x + 0.5, y + 0.5, 'CRUNCH!', '#d9b25a');
        }
      }
    }
  }
  // hurt enemies
  G.enemies.forEach(e => {
    if (!e.dead && dist(e.fx, e.fy, b.fx, b.fy) <= T.radius + 0.3) hurtEnemy(e, T.dmg, b);
  });
  // BOOST the hero (your own bombs never hurt you)
  const h = G.hero;
  if (T.boost && !h.dead && dist(h.fx, h.fy, b.fx, b.fy) <= T.radius) {
    const a = h.faceAngle;
    if (T.boost === 'up') {
      h.boosting = true; h.boostUntil = now + 900; h.boostFrom = now;
      h.boostVx = 0; h.boostVy = 0;
    } else if (T.boost === 'diag') {
      h.boosting = true; h.boostUntil = now + 900; h.boostFrom = now;
      h.boostVx = Math.cos(a) * 2.8; h.boostVy = Math.sin(a) * 2.8;
    } else if (T.boost === 'side') {
      h.dashUntil = now + 430;
      h.dashVx = Math.cos(a) * 6.5; h.dashVy = Math.sin(a) * 6.5;
      h.jumpUntil = now + 430;   // skims over spikes
    }
    sfx.boost();
    floatText(h.fx, h.fy, T.boost === 'side' ? 'WHOOSH!' : 'BOOST!', '#ff8c1a');
  }
}
function hurtHero(amount) {
  const h = G.hero, now = performance.now();
  if (h.dead || now < h.iframesUntil) return;
  h.hearts -= amount * 2;      // amount in full hearts -> stored as halves? pass halves directly
  h.hurtUntil = now + 250;
  h.iframesUntil = now + 700;
  sfx.hurt(); shake();
  updateHUD();
  if (h.hearts <= 0) heroDie();
}
function heroDie() {
  const h = G.hero;
  h.dead = true; G.over = true;
  sfx.die();
  $('#death').classList.add('show');
  setTimeout(() => {
    $('#death').classList.remove('show');
    startFloor();
  }, 1600);
}
function reachStairs() {
  if (G.over) return;
  G.over = true; G.won = true;
  sfx.stairs();
  const bonus = 25;
  gems += bonus; save('bbt-gems', gems);
  const next = floorNum + 1;
  save('bbt-floor', Math.min(next, FLOORS.length + 1));
  $('#victorymsg').innerHTML = 'You beat <b>Floor ' + floorNum + '</b>! &nbsp;+' + bonus + ' ◆';
  $('#victorysub').textContent = next <= FLOORS.length
    ? 'Floor ' + next + ' awaits… Teleporting you home!'
    : 'You’ve conquered every floor (for now)! Teleporting home…';
  $('#victory').classList.add('show');
  updateHUD();
  setTimeout(goHome, 4200);
}
let wentHome = false;
function goHome() {
  if (wentHome) return; wentHome = true;
  if (String(location.href).startsWith('about')) { location.reload(); return; }
  location.href = 'index.html';
}
$('#gohome').addEventListener('click', goHome);
$('#quit').addEventListener('click', e => {
  if (history.length > 1 && document.referrer) { e.preventDefault(); history.back(); }
});

/* ---------- update ---------- */
function update(dt, now) {
  const h = G.hero;
  if (!G.over) {
    // input direction (keys + joystick), converted to iso-friendly axes
    let ix = 0, iy = 0;
    const k = G.keys;
    if (k['w'] || k['arrowup']) { ix -= 1; iy -= 1; }
    if (k['s'] || k['arrowdown']) { ix += 1; iy += 1; }
    if (k['a'] || k['arrowleft']) { ix -= 1; iy += 1; }
    if (k['d'] || k['arrowright']) { ix += 1; iy -= 1; }
    if (G.joy.active) {
      ix += G.joy.dx + G.joy.dy;   // screen-space joystick -> world axes
      iy += G.joy.dy - G.joy.dx;
    }
    const m = Math.hypot(ix, iy);
    h.moving = m > 0.01;
    if (h.moving) {
      const SPD = 3.9 * (h.boosting ? 1.8 : 1);
      const vx = ix / m * SPD * dt, vy = iy / m * SPD * dt;
      moveHero(h, vx, vy);
      h.faceAngle = Math.atan2(iy, ix);
      h.facing = (isoX(h.fx + ix, h.fy + iy) - isoX(h.fx, h.fy)) >= 0 ? 1 : -1;
      h.step += dt * 9;
    }

    // sideways dash (landmine) and diagonal carry (stick bomb)
    if (now < (h.dashUntil || 0)) moveHero(h, h.dashVx * dt, h.dashVy * dt);
    if (h.boosting && (h.boostVx || h.boostVy)) moveHero(h, h.boostVx * dt, h.boostVy * dt);

    // hop + boost arcs
    if (h.boosting) {
      const p = clamp((now - h.boostFrom) / (h.boostUntil - h.boostFrom), 0, 1);
      h.jumpZ = Math.sin(p * Math.PI) * 92;
      if (p >= 1) {
        h.boosting = false;
        let t = tileAt(h.fx, h.fy);
        if (!(t && t.kind === 'plat')) {
          // forgiving landing: glide onto a platform edge if one is close
          let best = 0.95, bx = 0, by = 0, found = false;
          for (let ty = Math.floor(h.fy) - 1; ty <= Math.floor(h.fy) + 1; ty++) {
            for (let tx = Math.floor(h.fx) - 1; tx <= Math.floor(h.fx) + 1; tx++) {
              const tt = (G.tiles[ty] || [])[tx];
              if (tt && tt.kind === 'plat') {
                const d = dist(h.fx, h.fy, tx + 0.5, ty + 0.5);
                if (d < best) { best = d; bx = tx + 0.5; by = ty + 0.5; found = true; }
              }
            }
          }
          if (found) { h.fx = bx; h.fy = by; t = tileAt(bx, by); }
        }
        h.elev = (t && t.kind === 'plat') ? 1 : 0;
        if (h.elev === 1) floatText(h.fx, h.fy, 'UP TOP!', '#ffd23f');
      }
    } else if (now < h.jumpUntil) {
      h.jumpZ = Math.sin((1 - (h.jumpUntil - now) / 460) * Math.PI) * 34;
    } else h.jumpZ = 0;

    // stepping off a platform drops you down
    if (h.elev === 1 && !h.boosting) {
      const t = tileAt(h.fx, h.fy);
      if (t && t.kind !== 'plat') { h.elev = 0; h.jumpUntil = now + 240; }
    }

    // spikes (only on the ground, not mid-air)
    const t = tileAt(h.fx, h.fy);
    if (t && t.kind === 'spike' && h.elev === 0 && h.jumpZ < 12) {
      const up = ((now / 1000 + t.spikePhase) % 1.8) < 0.7;
      if (up && now > h.spikeHurtAt) {
        h.spikeHurtAt = now + 800;
        floatText(h.fx, h.fy, 'SPIKES!', '#ff5c7a');
        hurtHero(0.5);
      }
    }

    // bomb crates
    G.crates.forEach(c => {
      if (!c.taken && dist(c.x, c.y, h.fx, h.fy) < 0.75) {
        c.taken = true; sfx.pickup();
        h.belt[h.sel] = (h.belt[h.sel] || 0) + 2;
        floatText(c.x, c.y, '+2 ' + BOMB_TYPES[h.sel].name.toUpperCase() + 'S', '#ff8c1a');
        updateHUD();
      }
    });

    // the staircase!
    if (dist(G.stairs.x, G.stairs.y, h.fx, h.fy) < 0.85) reachStairs();
  }

  // bombs: fuses, mines, remotes, sticky riders
  for (let i = G.bombs.length - 1; i >= 0; i--) {
    const b = G.bombs[i], T = BOMB_TYPES[b.type];
    if (b.stuckTo && !b.stuckTo.dead) { b.fx = b.stuckTo.fx; b.fy = b.stuckTo.fy; }
    if (T.mine && !b.goBoom) {
      if (now < b.armAt) continue;
      let touched = false;
      if (!h.dead && h.elev === 0 && dist(h.fx, h.fy, b.fx, b.fy) < 0.5) touched = true;
      if (!touched) touched = G.enemies.some(e => !e.dead && dist(e.fx, e.fy, b.fx, b.fy) < 0.55);
      if (touched) { G.bombs.splice(i, 1); explode(b); }
      continue;
    }
    if (b.remote && !b.goBoom) continue;
    const fu = b.fuse || T.fuse || 0;
    if (b.goBoom || now - b.at >= fu) { G.bombs.splice(i, 1); explode(b); }
  }
  // show the DETONATE button only while remote bombs are waiting
  const det = document.getElementById('t-det');
  if (det) det.style.display = G.bombs.some(b => b.remote) ? 'grid' : 'none';

  // enemies
  G.enemies.forEach(e => {
    if (e.dead || G.over) return;
    const dh = dist(e.fx, e.fy, h.fx, h.fy);
    const heroReachable = h.elev === 0;   // can't reach you up on platforms
    if (dh < e.aggro && heroReachable && !h.dead) {
      const mx = (h.fx - e.fx) / (dh || 1), my = (h.fy - e.fy) / (dh || 1);
      if (dh > 0.72) moveEnemy(e, mx * e.speed * dt, my * e.speed * dt);
      e.facing = (isoX(h.fx, h.fy) - isoX(e.fx, e.fy)) >= 0 ? 1 : -1;
      e.step = (e.step || 0) + dt * 8;
      if (dh < 0.95 && now >= e.swipeReadyAt) {
        e.swipeReadyAt = now + e.swipeCool;
        e.swingUntil = now + 200;
        hurtHero(0.5);
      }
    } else {
      // lazy wander near home
      if (now > (e.wanderAt || 0)) {
        e.wanderAt = now + 1600 + rand(e.seed + now) * 1800;
        e.wx = e.homeX + (rand(e.seed * 3 + now) - 0.5) * 3;
        e.wy = e.homeY + (rand(e.seed * 7 + now) - 0.5) * 3;
      }
      const dw = dist(e.fx, e.fy, e.wx, e.wy);
      if (dw > 0.3) {
        moveEnemy(e, (e.wx - e.fx) / dw * e.speed * 0.45 * dt, (e.wy - e.fy) / dw * e.speed * 0.45 * dt);
        e.facing = (isoX(e.wx, e.wy) - isoX(e.fx, e.fy)) >= 0 ? 1 : -1;
        e.step = (e.step || 0) + dt * 5;
      }
    }
  });

  // camera follows
  G.cam.x += (h.fx - G.cam.x) * Math.min(1, 5 * dt);
  G.cam.y += (h.fy - G.cam.y) * Math.min(1, 5 * dt);
}

/* ============================================================
   RENDER
   ============================================================ */
let view = { w: 0, h: 0, dpr: 1 };
function resize() {
  view.dpr = Math.min(2, window.devicePixelRatio || 1);
  view.w = innerWidth; view.h = innerHeight;
  canvas.width = view.w * view.dpr; canvas.height = view.h * view.dpr;
  canvas.style.width = view.w + 'px'; canvas.style.height = view.h + 'px';
}
addEventListener('resize', resize);
resize();

const light = document.createElement('canvas');
const lctx = light.getContext('2d');

function render(now) {
  const w = view.w, hgt = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  // dank backdrop
  const bg = ctx.createLinearGradient(0, 0, 0, hgt);
  bg.addColorStop(0, '#120d1c'); bg.addColorStop(1, '#0a0710');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, hgt);

  let ox = w / 2 - isoX(G.cam.x, G.cam.y);
  let oy = hgt / 2 - isoY(G.cam.x, G.cam.y) + 20;
  if (now < G.shakeUntil) { ox += (Math.random() - 0.5) * 9; oy += (Math.random() - 0.5) * 7; }

  const h = G.hero;
  // ---- floor pass ----
  for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) {
    const t = G.tiles[y][x];
    if (isSolidKind(t.kind)) continue;
    const sx = ox + isoX(x + 0.5, y + 0.5), sy = oy + isoY(x + 0.5, y + 0.5);
    if (sx < -80 || sx > w + 80 || sy < -90 || sy > hgt + 90) continue;
    if (t.kind === 'plat') continue;   // drawn raised, in the sorted pass
    drawTileDiamond(sx, sy, t, x, y, now);
  }

  // ---- sorted world pass ----
  const draws = [];
  for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) {
    const t = G.tiles[y][x];
    if (t.kind === 'wall' || t.kind === 'crack') draws.push({ d: x + y, f: () => drawWallBlock(ox, oy, x, y, t, now) });
    if (t.kind === 'plat') draws.push({ d: x + y, f: () => drawPlatform(ox, oy, x, y) });
  }
  G.torches.forEach(tc => draws.push({ d: tc.x + tc.y + 0.05, f: () => drawTorch(ox, oy, tc, now) }));
  G.rubble.forEach(r => draws.push({ d: r.fx + r.fy - 0.4, f: () => drawRubble(ox, oy, r) }));
  G.crates.forEach(c => { if (!c.taken) draws.push({ d: c.x + c.y, f: () => drawCrate(ox, oy, c) }); });
  G.bombs.forEach(b => draws.push({ d: b.fx + b.fy, f: () => drawBomb(ox, oy, b, now) }));
  G.enemies.forEach(e => draws.push({ d: e.fx + e.fy, f: () => drawEnemy(ox, oy, e, now) }));
  draws.push({ d: h.fx + h.fy + (h.elev ? 2 : 0), f: () => drawHero(ox, oy, h, now) });
  draws.push({ d: G.stairs.x + G.stairs.y - 0.6, f: () => drawStairs(ox, oy, now) });
  G.chains.forEach(c => draws.push({ d: c.x + c.y + 0.6, f: () => drawChain(ox, oy, c, now) }));
  draws.sort((a, b) => a.d - b.d);
  draws.forEach(it => it.f());

  // ---- effects ----
  G.booms = G.booms.filter(b => now - b.at < 480);
  G.booms.forEach(b => drawBoom(ox, oy, b, now));
  G.floats = G.floats.filter(f => now - f.at < 950);
  G.floats.forEach(f => {
    const p = (now - f.at) / 950;
    ctx.globalAlpha = 1 - p;
    ctx.font = "17px 'Luckiest Guy', cursive";
    ctx.fillStyle = f.color;
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, ox + isoX(f.fx, f.fy), oy + isoY(f.fx, f.fy) - 60 - p * 34);
    ctx.globalAlpha = 1;
  });

  // ---- torch lighting: darkness with warm holes ----
  if (light.width !== canvas.width) { light.width = canvas.width; light.height = canvas.height; }
  lctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  lctx.clearRect(0, 0, w, hgt);
  lctx.fillStyle = 'rgba(4,2,10,0.60)';
  lctx.fillRect(0, 0, w, hgt);
  lctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a) => {
    const g = lctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,' + a + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g;
    lctx.beginPath(); lctx.arc(x, y, r, 0, 7); lctx.fill();
  };
  G.torches.forEach(tc => {
    const f = 0.85 + Math.sin(now / 90 + tc.seed) * 0.12;
    hole(ox + isoX(tc.x, tc.y), oy + isoY(tc.x, tc.y) - 30, 130 * f, 0.95);
  });
  hole(ox + isoX(h.fx, h.fy), oy + isoY(h.fx, h.fy) - 20, 185, 1);
  hole(ox + isoX(G.stairs.x, G.stairs.y), oy + isoY(G.stairs.x, G.stairs.y) - 20, 120, 0.9);
  G.booms.forEach(b => hole(ox + isoX(b.fx, b.fy), oy + isoY(b.fx, b.fy), 300 * (1 - (now - b.at) / 480), 1));
  lctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(light, 0, 0, w, hgt);

  // warm torch glow tint
  ctx.globalCompositeOperation = 'lighter';
  G.torches.forEach(tc => {
    const f = 0.8 + Math.sin(now / 95 + tc.seed) * 0.2;
    const gx = ox + isoX(tc.x, tc.y), gy = oy + isoY(tc.x, tc.y) - 30;
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 95 * f);
    g.addColorStop(0, 'rgba(255,150,50,0.16)');
    g.addColorStop(1, 'rgba(255,150,50,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(gx, gy, 95 * f, 0, 7); ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';

  // vignette
  const v = ctx.createRadialGradient(w / 2, hgt / 2, Math.min(w, hgt) * 0.36, w / 2, hgt / 2, Math.max(w, hgt) * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, w, hgt);
}

/* ---------- tile & prop drawing ---------- */
function diamondPath(sx, sy, inset) {
  const hw = ISO.TW / 2 - inset, hh = ISO.TH / 2 - inset * 0.5;
  ctx.beginPath();
  ctx.moveTo(sx, sy - hh); ctx.lineTo(sx + hw, sy); ctx.lineTo(sx, sy + hh); ctx.lineTo(sx - hw, sy);
  ctx.closePath();
}
function drawTileDiamond(sx, sy, t, x, y, now) {
  const alt = (x + y) % 2 === 0;
  if (t.kind === 'carpet') {
    diamondPath(sx, sy, 0);
    ctx.fillStyle = alt ? '#8e1f28' : '#821b24'; ctx.fill();
    diamondPath(sx, sy, 5);
    ctx.strokeStyle = 'rgba(255,200,90,0.5)'; ctx.lineWidth = 1.6; ctx.stroke();
  } else if (t.kind === 'spike') {
    diamondPath(sx, sy, 0);
    ctx.fillStyle = '#2c2733'; ctx.fill();
    const up = ((now / 1000 + t.spikePhase) % 1.8) < 0.7;
    const hgt2 = up ? 13 : 3;
    ctx.fillStyle = up ? '#c9ced6' : '#565060';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(sx + i * 13 - 5, sy + 3); ctx.lineTo(sx + i * 13, sy + 3 - hgt2); ctx.lineTo(sx + i * 13 + 5, sy + 3);
      ctx.closePath(); ctx.fill();
    }
  } else if (t.kind === 'stairs') {
    diamondPath(sx, sy, 0);
    ctx.fillStyle = '#3a3540'; ctx.fill();
  } else {
    diamondPath(sx, sy, 0);
    ctx.fillStyle = alt ? '#3a3540' : '#363139'; ctx.fill();
    diamondPath(sx, sy, 1);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1; ctx.stroke();
  }
}
function drawWallBlock(ox, oy, x, y, t, now) {
  const sx = ox + isoX(x + 0.5, y + 0.5), sy = oy + isoY(x + 0.5, y + 0.5);
  if (sx < -90 || sx > view.w + 90 || sy < -140 || sy > view.h + 140) return;
  const hw = ISO.TW / 2, hh = ISO.TH / 2, H = WALL_H;
  const cracked = t.kind === 'crack';
  // top
  ctx.beginPath();
  ctx.moveTo(sx, sy - hh - H); ctx.lineTo(sx + hw, sy - H); ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx - hw, sy - H);
  ctx.closePath();
  ctx.fillStyle = cracked ? '#4e4356' : '#4a4152'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1; ctx.stroke();
  // left face
  ctx.beginPath();
  ctx.moveTo(sx - hw, sy - H); ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx, sy + hh); ctx.lineTo(sx - hw, sy);
  ctx.closePath();
  ctx.fillStyle = cracked ? '#38303f' : '#332c3a'; ctx.fill();
  // right face
  ctx.beginPath();
  ctx.moveTo(sx + hw, sy - H); ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx, sy + hh); ctx.lineTo(sx + hw, sy);
  ctx.closePath();
  ctx.fillStyle = cracked ? '#2c2533' : '#28222e'; ctx.fill();
  // mortar hint on faces
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(sx - hw, sy - H / 2); ctx.lineTo(sx, sy + hh - H / 2); ctx.moveTo(sx, sy + hh - H / 2); ctx.lineTo(sx + hw, sy - H / 2); ctx.stroke();
  if (cracked) {
    ctx.strokeStyle = '#d9b25a'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx - 12, sy - H + 6); ctx.lineTo(sx - 4, sy - H + 16); ctx.lineTo(sx - 10, sy - H + 24); ctx.lineTo(sx - 2, sy - H + 34);
    ctx.moveTo(sx + 10, sy - H + 10); ctx.lineTo(sx + 4, sy - H + 20); ctx.lineTo(sx + 12, sy - H + 30);
    ctx.stroke();
  }
}
function drawPlatform(ox, oy, x, y) {
  const sx = ox + isoX(x + 0.5, y + 0.5), sy = oy + isoY(x + 0.5, y + 0.5);
  if (sx < -90 || sx > view.w + 90 || sy < -140 || sy > view.h + 140) return;
  const hw = ISO.TW / 2, hh = ISO.TH / 2, H = PLAT_H;
  // skirt
  ctx.beginPath();
  ctx.moveTo(sx - hw, sy - H); ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx, sy + hh); ctx.lineTo(sx - hw, sy); ctx.closePath();
  ctx.fillStyle = '#443c4e'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx + hw, sy - H); ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx, sy + hh); ctx.lineTo(sx + hw, sy); ctx.closePath();
  ctx.fillStyle = '#332c3c'; ctx.fill();
  // top slab
  ctx.beginPath();
  ctx.moveTo(sx, sy - hh - H); ctx.lineTo(sx + hw, sy - H); ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx - hw, sy - H);
  ctx.closePath();
  ctx.fillStyle = '#5b5166'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,120,0.25)'; ctx.lineWidth = 1.4; ctx.stroke();
}
function drawTorch(ox, oy, tc, now) {
  const off = tc.side === 's' ? { x: 0, y: 0.52 } : { x: 0.52, y: 0 };
  const sx = ox + isoX(tc.x + off.x, tc.y + off.y), sy = oy + isoY(tc.x + off.x, tc.y + off.y);
  ctx.strokeStyle = '#6b4a24'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx, sy - 26); ctx.lineTo(sx, sy - 46); ctx.stroke();
  const f = Math.sin(now / 85 + tc.seed) * 2.5;
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(sx - 6, sy - 46); ctx.quadraticCurveTo(sx - 7 + f, sy - 60, sx + f * 0.6, sy - 68);
  ctx.quadraticCurveTo(sx + 7 + f, sy - 58, sx + 6, sy - 46);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffd93b';
  ctx.beginPath(); ctx.arc(sx + f * 0.4, sy - 52, 4.5, 0, 7); ctx.fill();
}
function drawChain(ox, oy, c, now) {
  const sx = ox + isoX(c.x, c.y), syTop = oy + isoY(c.x, c.y) - 210;
  const sway = Math.sin(now / 900 + c.phase) * 7;
  ctx.strokeStyle = '#575061'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  const links = Math.floor(c.len / 11);
  let px = sx, py = syTop;
  for (let i = 0; i < links; i++) {
    const p = i / links;
    const nx = sx + sway * p * p, ny = syTop + (i + 1) * 11;
    ctx.beginPath(); ctx.ellipse((px + nx) / 2, (py + ny) / 2, 3, 5.5, Math.atan2(ny - py, nx - px), 0, 7); ctx.stroke();
    px = nx; py = ny;
  }
  ctx.fillStyle = '#6b6275';
  ctx.beginPath(); ctx.arc(px, py + 3, 4, 0, 7); ctx.fill();
}
function drawRubble(ox, oy, r) {
  const sx = ox + isoX(r.fx, r.fy), sy = oy + isoY(r.fx, r.fy);
  ctx.fillStyle = '#4e4356';
  for (let i = 0; i < 5; i++) {
    const a = rand(r.seed + i) * 6.28, d = rand(r.seed * 2 + i) * 14;
    ctx.beginPath(); ctx.arc(sx + Math.cos(a) * d, sy + Math.sin(a) * d * 0.5, 3.5 + rand(i) * 3, 0, 7); ctx.fill();
  }
}
function drawCrate(ox, oy, c) {
  const sx = ox + isoX(c.x, c.y), sy = oy + isoY(c.x, c.y);
  ctx.fillStyle = '#8a5a2b'; ctx.strokeStyle = '#3c2a12'; ctx.lineWidth = 2.5;
  ctx.fillRect(sx - 13, sy - 26, 26, 22); ctx.strokeRect(sx - 13, sy - 26, 26, 22);
  ctx.beginPath(); ctx.moveTo(sx - 13, sy - 26); ctx.lineTo(sx + 13, sy - 4); ctx.moveTo(sx + 13, sy - 26); ctx.lineTo(sx - 13, sy - 4); ctx.stroke();
  ctx.fillStyle = '#26262f';
  ctx.beginPath(); ctx.arc(sx, sy - 30, 6.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ff8c1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(sx, sy - 36); ctx.quadraticCurveTo(sx + 4, sy - 40, sx + 2, sy - 43); ctx.stroke();
}
function drawBomb(ox, oy, b, now) {
  const sx = ox + isoX(b.fx, b.fy);
  let sy = oy + isoY(b.fx, b.fy);
  if (b.stuckTo && !b.stuckTo.dead) sy -= 30;   // riding on a monster's head
  const T = BOMB_TYPES[b.type];
  const fu = b.fuse || T.fuse || 0;
  const p = fu ? (now - b.at) / fu : 0;
  const flash = ((fu && p > 0.6) || b.goBoom) && Math.floor(now / 90) % 2 === 0;
  const sparkFlame = () => {
    const f = Math.sin(now / 60) * 2;
    ctx.fillStyle = '#ffd93b';
    ctx.beginPath(); ctx.arc(sx + 5 + f * 0.4, sy - 31, 3.5, 0, 7); ctx.fill();
  };
  if (b.type === 'dynamite') {
    ctx.strokeStyle = '#0a0a10'; ctx.lineWidth = 1.6;
    [-7, 0, 7].forEach((dx, i) => {
      ctx.fillStyle = flash ? '#7a2a2a' : (i === 1 ? '#c9532f' : '#b3402a');
      ctx.beginPath(); ctx.roundRect(sx + dx - 3.4, sy - (i === 1 ? 26 : 22), 6.8, i === 1 ? 26 : 22, 3); ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle = '#6b3a1a'; ctx.fillRect(sx - 11, sy - 16, 22, 4);
    ctx.strokeStyle = '#a9743c'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(sx, sy - 26); ctx.quadraticCurveTo(sx + 4, sy - 31, sx + 3, sy - 33); ctx.stroke();
    ctx.fillStyle = '#ffd93b'; ctx.beginPath(); ctx.arc(sx + 3, sy - 34, 3, 0, 7); ctx.fill();
  } else if (b.type === 'landmine') {
    const armed = now >= (b.armAt || 0);
    ctx.fillStyle = '#6a7280'; ctx.strokeStyle = '#2c323a'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(sx, sy - 3, 13, 6.5, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8d959d';
    ctx.beginPath(); ctx.ellipse(sx, sy - 7, 6.5, 3.2, 0, 0, 7); ctx.fill(); ctx.stroke();
    if (armed && Math.floor(now / 300) % 2 === 0) {
      ctx.fillStyle = '#ff3b3b';
      ctx.beginPath(); ctx.arc(sx, sy - 8, 2.4, 0, 7); ctx.fill();
    }
  } else if (b.type === 'timebomb') {
    ctx.fillStyle = flash ? '#7a2a2a' : '#33333e'; ctx.strokeStyle = '#0a0a10'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.roundRect(sx - 13, sy - 22, 26, 18, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#dff3e0';
    ctx.fillRect(sx - 9, sy - 18, 18, 8);
    const remain = Math.max(0, Math.ceil((fu - (now - b.at)) / 1000));
    ctx.fillStyle = '#1a7a2a';
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('0:0' + remain, sx, sy - 11);
  } else if (b.type === 'remote') {
    ctx.fillStyle = flash ? '#7a2a2a' : '#26262f';
    ctx.strokeStyle = '#0a0a10'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy - 9, 10, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#8d959d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(sx + 4, sy - 17); ctx.lineTo(sx + 11, sy - 30); ctx.stroke();
    ctx.fillStyle = Math.floor(now / 400) % 2 === 0 ? '#ff3b3b' : '#7a2222';
    ctx.beginPath(); ctx.arc(sx + 11.5, sy - 31, 3, 0, 7); ctx.fill();
  } else if (b.type === 'stick') {
    ctx.fillStyle = flash ? '#7a2a2a' : '#3c6e33'; ctx.strokeStyle = '#1e3a18'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(sx, sy - 10, 10, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#1e3a18'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(sx - 9, sy - 13); ctx.lineTo(sx + 9, sy - 13);
    ctx.moveTo(sx - 9, sy - 7); ctx.lineTo(sx + 9, sy - 7);
    ctx.moveTo(sx - 4, sy - 19.5); ctx.lineTo(sx - 4, sy - 0.5);
    ctx.moveTo(sx + 4, sy - 19.5); ctx.lineTo(sx + 4, sy - 0.5);
    ctx.stroke();
    ctx.strokeStyle = '#c9ced6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx + 8, sy - 21, 3.5, 0, 7); ctx.stroke();
  } else {
    ctx.fillStyle = flash ? '#7a2a2a' : '#26262f';
    ctx.strokeStyle = '#0a0a10'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy - 9, 11, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#a9743c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx + 3, sy - 19); ctx.quadraticCurveTo(sx + 8, sy - 26, sx + 5, sy - 30); ctx.stroke();
    sparkFlame();
  }
}
function drawBoom(ox, oy, b, now) {
  const sx = ox + isoX(b.fx, b.fy), sy = oy + isoY(b.fx, b.fy);
  const p = (now - b.at) / 480;
  const R = b.radius * ISO.TW * 0.62 * (0.4 + p * 0.8);
  ctx.globalAlpha = 1 - p;
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath(); ctx.ellipse(sx, sy - 6, R, R * 0.55, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd93b';
  ctx.beginPath(); ctx.ellipse(sx, sy - 6, R * 0.62, R * 0.34, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawStairs(ox, oy, now) {
  const sx = ox + isoX(G.stairs.x, G.stairs.y), sy = oy + isoY(G.stairs.x, G.stairs.y);
  // glowing doorway arch + ascending steps
  const pulse = 0.75 + Math.sin(now / 400) * 0.25;
  ctx.fillStyle = 'rgba(255,210,80,' + (0.14 * pulse) + ')';
  ctx.beginPath(); ctx.ellipse(sx, sy, 40, 20, 0, 0, 7); ctx.fill();
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i % 2 ? '#6b6275' : '#5b5166';
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.5;
    const wq = 30 - i * 5, hq = 9, yq = sy - i * 10;
    ctx.fillRect(sx - wq / 2, yq - hq, wq, hq);
    ctx.strokeRect(sx - wq / 2, yq - hq, wq, hq);
  }
  ctx.fillStyle = '#ffd93b';
  ctx.font = "15px 'Luckiest Guy', cursive"; ctx.textAlign = 'center';
  ctx.globalAlpha = pulse;
  ctx.fillText('UP', sx, sy - 46);
  ctx.globalAlpha = 1;
}

/* ---------- characters ---------- */
function drawShadow(sx, sy, r, lift) {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(sx, sy, r * (1 - lift * 0.3), r * 0.45 * (1 - lift * 0.3), 0, 0, 7); ctx.fill();
}
function drawHero(ox, oy, h, now) {
  const lift = (h.elev ? PLAT_H : 0) + h.jumpZ;
  const sx = ox + isoX(h.fx, h.fy), syg = oy + isoY(h.fx, h.fy);
  const sy = syg - lift;
  drawShadow(sx, syg - (h.elev ? PLAT_H : 0), 13, h.jumpZ / 90);
  const hurt = now < h.hurtUntil;
  const bob = h.moving ? Math.sin(h.step) * 2.2 : 0;
  const F = h.facing;
  ctx.save();
  ctx.translate(sx, sy - 16 + bob);
  if (hurt && Math.floor(now / 70) % 2 === 0) ctx.globalAlpha = 0.45;
  // legs
  ctx.strokeStyle = '#2c3e55'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const lp = h.moving ? Math.sin(h.step) * 5 : 0;
  ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-4 - lp * 0.6, 16); ctx.moveTo(4, 6); ctx.lineTo(4 + lp * 0.6, 16); ctx.stroke();
  // body
  ctx.fillStyle = '#3b6ea5'; ctx.strokeStyle = '#1d3a5a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(-9, -10, 18, 18, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c9ced6';
  ctx.beginPath(); ctx.roundRect(-9, -10, 18, 7, 4); ctx.fill();
  // head
  ctx.fillStyle = '#f0c8a0'; ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -18, 9, 0, 7); ctx.fill(); ctx.stroke();
  // helm
  ctx.fillStyle = '#c9ced6'; ctx.strokeStyle = '#6a7280'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -20, 9.5, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.fillRect(-10, -21, 20, 3);
  // eyes
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(3 * F, -17, 1.6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(7 * F, -17, 1.6, 0, 7); ctx.fill();
  // sword arm
  const swinging = now < h.swingUntil;
  const ang = swinging ? -1.5 + (1 - (h.swingUntil - now) / 180) * 2.4 : -0.5;
  ctx.save();
  ctx.translate(8 * F, -4);
  ctx.rotate(ang * F);
  ctx.strokeStyle = '#f0c8a0'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(7 * F, 2); ctx.stroke();
  // sword
  ctx.strokeStyle = '#e8edf2'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(7 * F, 2); ctx.lineTo(21 * F, -4); ctx.stroke();
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(9.5 * F, 3.5); ctx.lineTo(12 * F, -2.5); ctx.stroke();
  ctx.restore();
  if (swinging) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -4, 24, h.faceAngle - 1 + (F < 0 ? Math.PI : 0), h.faceAngle + 1 + (F < 0 ? Math.PI : 0)); ctx.stroke();
  }
  ctx.restore();
}
function drawEnemy(ox, oy, e, now) {
  if (e.dead && now - e.deadAt > 500) return;
  const sx = ox + isoX(e.fx, e.fy), sy = oy + isoY(e.fx, e.fy);
  if (e.dead) {
    const p = (now - e.deadAt) / 500;
    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = '#aaa';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(sx + (rand(i + e.seed) - 0.5) * 30 * p * 2, sy - 10 - p * 20, 4 * (1 - p), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    return;
  }
  drawShadow(sx, sy, 12, 0);
  const hurt = now < e.hurtUntil;
  const bob = Math.sin(e.step || 0) * 2;
  const F = e.facing;
  ctx.save();
  ctx.translate(sx, sy - 15 + bob);
  if (hurt) { ctx.globalAlpha = 0.6; }
  // legs
  ctx.strokeStyle = e.cloth; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  const lp = Math.sin(e.step || 0) * 4;
  ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-4 - lp * 0.6, 15); ctx.moveTo(4, 6); ctx.lineTo(4 + lp * 0.6, 15); ctx.stroke();
  // body
  ctx.fillStyle = e.cloth; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.roundRect(-8, -9, 16, 16, 4); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle = e.body;
  ctx.beginPath(); ctx.arc(0, -17, 8.5, 0, 7); ctx.fill(); ctx.stroke();
  // eyes
  ctx.fillStyle = e.eye;
  ctx.beginPath(); ctx.arc(3 * F, -17, 1.7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(6.5 * F, -17, 1.7, 0, 7); ctx.fill();
  if (e.kind === 'skeleton') {   // rib lines
    ctx.strokeStyle = '#f5f2ea'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-5, -4); ctx.lineTo(5, -4); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.moveTo(-4, 4); ctx.lineTo(4, 4);
    ctx.stroke();
  }
  // swiping arm
  const swinging = now < (e.swingUntil || 0);
  ctx.strokeStyle = e.body; ctx.lineWidth = 4;
  const aa = swinging ? -0.9 : 0.35;
  ctx.beginPath(); ctx.moveTo(7 * F, -3); ctx.lineTo(7 * F + Math.cos(aa) * 10 * F, -3 + Math.sin(aa) * 10); ctx.stroke();
  // hp pips
  if (e.hp < ENEMY_KINDS[e.kind].hp) {
    ctx.fillStyle = '#ff4d5e';
    for (let i = 0; i < e.hp; i++) { ctx.beginPath(); ctx.arc(-8 + i * 6, -30, 2.4, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  G.keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (k === ' ') heroJump();
  if (k === 'k' || k === 'j') heroAttack();
  if (k === 'b') placeBomb();
  if (k === 'v' || k === 'tab') { e.preventDefault(); cycleBomb(); }
  if (k === 'r') detonateRemotes();
  if (k === 't') cycleTimer();
  const n = parseInt(k, 10);
  if (n >= 1 && n <= BOMB_ORDER.length) {
    const t = BOMB_ORDER[n - 1];
    if (t in G.hero.belt) { G.hero.sel = t; updateHUD(); }
  }
});
addEventListener('keyup', e => { G.keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousedown', () => heroAttack());

const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
const joyEl = $('#joy'), knob = joyEl.querySelector('.knob'), joyzone = $('#joyzone');
let joyId = null, joyCx = 0, joyCy = 0;
joyzone.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  joyId = t.identifier; joyCx = t.clientX; joyCy = t.clientY;
  joyEl.style.left = (joyCx - 54) + 'px'; joyEl.style.bottom = 'auto'; joyEl.style.top = (joyCy - 54) + 'px';
  G.joy.active = true;
  e.preventDefault();
}, { passive: false });
addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyId) continue;
    const dx = t.clientX - joyCx, dy = t.clientY - joyCy;
    const m = Math.hypot(dx, dy), cap = 44;
    const s = m > cap ? cap / m : 1;
    G.joy.dx = dx * s / cap; G.joy.dy = dy * s / cap;
    knob.style.transform = 'translate(' + dx * s + 'px,' + dy * s + 'px)';
  }
}, { passive: true });
addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyId) continue;
    joyId = null; G.joy.active = false; G.joy.dx = G.joy.dy = 0;
    knob.style.transform = 'translate(0,0)';
  }
});
const hold = (id, fn) => {
  const el = $(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false });
  el.addEventListener('mousedown', e => { e.preventDefault(); fn(); });
};
hold('#t-attack', heroAttack);
hold('#t-bomb', placeBomb);
hold('#t-swap', cycleBomb);
hold('#t-det', detonateRemotes);
hold('#t-jump', heroJump);

/* ---------- main loop ---------- */
startFloor();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* debug hooks (also fun for the developers to poke in the console!) */
window.__tower = {
  get G() { return G; },
  goto(x, y) { G.hero.fx = x; G.hero.fy = y; },
  win() { G.hero.fx = G.stairs.x; G.hero.fy = G.stairs.y; },
  hurt(n) { hurtHero(n); },
  god() { G.hero.iframesUntil = Infinity; },
};
</script>
