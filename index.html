:root {
  --night1: #0c111d;
  --night2: #182136;
  --night3: #2a3550;
  --ink-pale: #d9e2f5;
  --ink-dim: #8a94b0;
  --steel: #7f8dab;
  --iron: #1d2437;
  --electric: #9db8ff;
  --bolt: #dfe8ff;
  --gold: #ffc531;
  --gold-dark: #5b3a00;
  --fire: #ff5a36;
  --fire-dark: #4d1405;
  --warm: #ffb347;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Luckiest Guy', 'Arial Rounded MT Bold', system-ui, sans-serif;
  background: var(--night1);
  color: var(--ink-pale);
  overflow: hidden;
}
.page { position: fixed; inset: 0; overflow: hidden; }
.page.kaboom { animation: shake .4s linear; }
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-7px,4px); }
  40% { transform: translate(6px,-5px); }
  60% { transform: translate(-5px,2px); }
  80% { transform: translate(4px,-2px); }
}

/* ---------- storm sky, rain, lightning (all phases) ---------- */
.sky {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 60% at 50% 108%, #33405f 0%, rgba(51,64,95,0) 60%),
    linear-gradient(180deg, var(--night1) 0%, var(--night2) 55%, var(--night3) 100%);
}
.scud {
  position: absolute;
  border-radius: 50%;
  filter: blur(26px);
  background: #0a0e18;
  opacity: .75;
  animation: scud linear infinite;
}
.scud.s1 { width: 46vw; height: 15vh; top: 6%;  left: -50vw; animation-duration: 57s; }
.scud.s2 { width: 34vw; height: 12vh; top: 18%; left: -40vw; animation-duration: 83s; animation-delay: -40s; }
.scud.s3 { width: 55vw; height: 17vh; top: -4%; left: -60vw; animation-duration: 71s; animation-delay: -22s; }
@keyframes scud { to { transform: translateX(210vw); } }
.rain {
  position: absolute; inset: -30% -10%;
  background: repeating-linear-gradient(78deg,
    transparent 0 46px, rgba(190,205,235,.14) 46px 47.5px, transparent 47.5px 92px);
  animation: rainmove .85s linear infinite;
  pointer-events: none;
}
.rain.fine {
  background: repeating-linear-gradient(80deg,
    transparent 0 23px, rgba(190,205,235,.08) 23px 24px, transparent 24px 46px);
  animation-duration: .55s;
}
@keyframes rainmove { to { background-position: 130px 620px; } }
.phase-top .rain, .phase-lean .rain, .phase-fall .rain, .phase-whirl .rain { animation-duration: .3s; }
.phase-top .rain.fine, .phase-lean .rain.fine, .phase-fall .rain.fine, .phase-whirl .rain.fine { animation-duration: .2s; }

#flash {
  position: absolute; inset: 0;
  background: #e8eeff;
  opacity: 0;
  pointer-events: none;
  z-index: 40;
}
#flash.on { animation: flashfade .34s ease-out; }
@keyframes flashfade { 0% { opacity: .85; } 18% { opacity: .25; } 34% { opacity: .6; } 100% { opacity: 0; } }
.boltsvg {
  position: absolute;
  top: 0;
  height: 52vh; width: auto;
  opacity: 0;
  pointer-events: none;
  z-index: 39;
  filter: drop-shadow(0 0 9px rgba(170,196,255,.9));
}
.boltsvg.b1 { left: 16%; }
.boltsvg.b2 { right: 20%; }
.boltsvg.on { animation: boltflick .3s steps(3, jump-none); }
@keyframes boltflick { 0% { opacity: 1; } 50% { opacity: .35; } 100% { opacity: 0; } }

/* ---------- phases ---------- */
.cine, .topview, .lookdown, .home, .mute, .skip { display: none; }
.phase-top .cine, .phase-lean .cine, .phase-fall .cine, .phase-whirl .cine { display: block; }
.phase-top .topview, .phase-lean .topview { display: block; }
.phase-lean .lookdown, .phase-fall .lookdown, .phase-whirl .lookdown { display: block; }
.phase-home .home { display: flex; }
.phase-top .mute, .phase-lean .mute, .phase-fall .mute, .phase-whirl .mute, .phase-home .mute { display: grid; }
.phase-top .skip, .phase-lean .skip, .phase-fall .skip, .phase-whirl .skip { display: block; }

/* ---------- cinematic ---------- */
.cine { position: absolute; inset: 0; z-index: 5; transform-origin: 50% 50%; }
.phase-whirl .cine { animation: whirlout .4s cubic-bezier(.55, 0, .9, .5) forwards; }
@keyframes whirlout {
  0% { transform: none; filter: blur(0); opacity: 1; }
  55% { filter: blur(6px); }
  100% { transform: rotate(180deg) scale(1.3); filter: blur(8px); opacity: 0; }
}

/* scene 1: at the parapet, walking up to the edge */
.topview { position: absolute; inset: 0; z-index: 2; animation: topzoom 1.5s ease-in forwards; }
@keyframes topzoom { to { transform: scale(1.09) translateY(2.5%); } }
/* scene 2: you tilt forward to look over — the horizon sweeps up and out of view */
.phase-lean .topview { animation: pitchup .9s cubic-bezier(.55, .05, .7, .35) forwards; }
@keyframes pitchup {
  from { transform: scale(1.09) translateY(2.5%); filter: blur(0); }
  to { transform: scale(1.35) translateY(-120%); filter: blur(2.5px); }
}
/* ...and you're staring straight down: the wall drops away beneath you, ground far below */
.lookdown { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
.phase-lean .lookdown { animation: lookenter .9s cubic-bezier(.25, .6, .3, 1) forwards; }
@keyframes lookenter { from { transform: translateY(103%); } to { transform: translateY(0); } }
.ldshake { position: absolute; inset: 0; }
.phase-fall .ldshake { animation: camshake .16s linear infinite alternate; }
@keyframes camshake { from { transform: translate(0, 0) rotate(0); } to { transform: translate(2.5px, -2px) rotate(.25deg); } }
.ldscene { position: absolute; inset: 0; transform-origin: 50% 45%; }
.phase-lean .ldscene { animation: vertigo 2.4s ease-in-out infinite alternate; }
@keyframes vertigo { from { transform: scale(1); } to { transform: scale(1.045); } }
.voidsky {
  position: absolute; inset: 0;
  background:
    radial-gradient(20% 14% at 50% 45%, rgba(96,116,158,.2), transparent 70%),
    linear-gradient(180deg, #0a0e17 0%, #121a2c 55%, #1c2438 100%);
}
/* the wall face below you: wide at your feet, tapering to a point far down */
.wallsvg { position: absolute; inset: 0; width: 100%; height: 100%; }
.wallsvg .static-courses { transition: opacity .5s ease; }
.phase-fall .wallsvg .static-courses { opacity: .4; }
/* stone courses rushing outward from the vanishing point as you fall */
.rushwrap {
  position: absolute; inset: 0;
  clip-path: polygon(50% 44%, -14% 103%, 114% 103%);
}
.courseo, .wino {
  position: absolute; inset: 0;
  transform-origin: 50% 45%;
  opacity: 0;
  pointer-events: none;
}
.courseo i {
  position: absolute; left: -12%; right: -12%; bottom: 4%;
  height: 12px;
  background: rgba(8, 12, 21, .8);
  border-top: 2px solid rgba(223, 232, 255, .07);
  border-radius: 5px;
  display: block;
}
.wino i {
  position: absolute;
  width: 52px; height: 70px;
  background: #0e1320;
  border: 2px solid #5a6684;
  border-radius: 26px 26px 6px 6px;
  display: block;
}
.wino.w1 i { left: 29%; bottom: 21%; }
.wino.w2 i { right: 26%; bottom: 29%; }
.phase-fall .courseo, .phase-fall .wino {
  animation: rushout 1.15s linear var(--d, 0s) infinite;
}
@keyframes rushout {
  0% { transform: scale(.02); opacity: 0; }
  14% { opacity: 1; }
  100% { transform: scale(1.55); opacity: 1; }
}
/* slow dolly toward the point while falling */
.phase-fall .ldscene { animation: ldzoom 4.6s ease-in forwards; }
@keyframes ldzoom { to { transform: scale(1.3); } }
.speedlines { position: absolute; inset: 0; opacity: 0; transform-origin: 50% 45%; }
.phase-fall .speedlines { opacity: 1; animation: lines .4s linear infinite; }
@keyframes lines { from { transform: scale(.55); opacity: 0; } 30% { opacity: .75; } to { transform: scale(1.3); opacity: 0; } }
/* the rim you leaned over, dropping away as you leave it behind */
.lip {
  position: absolute; left: -2%; right: -2%; bottom: -2px;
  height: 9vh;
  background: #10141f;
  border-top: 4px solid rgba(67, 80, 112, .55);
  box-shadow: 0 -14px 26px rgba(6, 9, 16, .55);
}
.phase-fall .lip { animation: lipaway .5s ease-in forwards; }
@keyframes lipaway { to { transform: translateY(90%) scaleY(2.2); opacity: 0; } }
.topview .parapet {
  position: absolute;
  bottom: -2px; left: -4%;
  width: 108%; height: auto;
}
.topview .haze {
  position: absolute;
  left: 0; right: 0; bottom: 24%;
  height: 20%;
  background: linear-gradient(180deg, rgba(42,53,80,0), rgba(72,86,120,.35));
  filter: blur(8px);
}


/* ---------- home screen ---------- */
.home {
  position: absolute; inset: 0;
  flex-direction: column;
  align-items: center;
  padding: clamp(.9rem, 2.5vw, 1.8rem);
  z-index: 6;
}
.home .tower {
  position: absolute;
  bottom: -2vh; left: 50%;
  transform: translateX(-50%);
  height: 96vh; width: auto;
  z-index: 0;
  pointer-events: none;
  filter: drop-shadow(0 0 34px rgba(10,14,24,.8));
}
.studio { margin-top: clamp(.4rem, 2vh, 1.4rem); text-align: center; z-index: 2; }
.studio .name {
  font-size: clamp(.95rem, 2.8vw, 1.3rem);
  letter-spacing: .26em;
  color: #c7d2ea;
  text-shadow: 0 0 12px rgba(157,184,255,.4);
}
.studio .name .arr { letter-spacing: 0; margin: 0 .4em; color: var(--electric); }
.studio .presents { font-size: clamp(.78rem, 2.2vw, .95rem); letter-spacing: .3em; color: var(--ink-dim); margin-top: .2rem; }

.logo { position: relative; width: fit-content; margin: clamp(.7rem, 3.5vh, 2rem) auto 0; z-index: 2; }
.logo::before {
  content: '';
  position: absolute; inset: -14% -22%;
  background: radial-gradient(ellipse 60% 55% at 50% 45%, rgba(8,11,18,.62), rgba(8,11,18,0) 72%);
  z-index: -2;
}
.word { line-height: .92; white-space: nowrap; }
.word span { display: inline-block; }
.word span:nth-child(odd)  { rotate: -2deg; }
.word span:nth-child(even) { rotate: 2.5deg; translate: 0 -2px; }
.word-bomb, .word-blast { paint-order: stroke fill; }
.word-bomb {
  font-size: clamp(3.6rem, 12vw, 6.6rem);
  color: var(--gold);
  -webkit-text-stroke: .07em var(--gold-dark);
  transform: rotate(-3deg);
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 .05em 0 #3a2500) drop-shadow(0 0 26px rgba(255,197,49,.3));
}
.word-blast {
  font-size: clamp(3rem, 10.5vw, 5.7rem);
  color: var(--fire);
  -webkit-text-stroke: .07em var(--fire-dark);
  transform: rotate(2.5deg);
  margin: -.24em 0 0 1.55em;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 .05em 0 #310b00) drop-shadow(0 0 26px rgba(255,90,54,.3));
}
.bomb-o { height: .98em; width: auto; vertical-align: -.1em; margin: 0 .01em; cursor: pointer; }
.bomb-o .flame { animation: flame .5s ease-in-out infinite alternate; transform-origin: 58px 16px; }
@keyframes flame { from { transform: scale(.85) rotate(-6deg); } to { transform: scale(1.12) rotate(8deg); } }
.kaboom .bomb-o .flame { animation: bigspark .45s ease-out; }
@keyframes bigspark { 40% { transform: scale(3) rotate(40deg); } 100% { transform: scale(1); } }
.burst-a { position: relative; }
.burst-a svg {
  position: absolute;
  width: 1.7em; height: 1.7em;
  left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  z-index: -1;
  animation: burstwob 2.6s ease-in-out infinite;
}
@keyframes burstwob {
  0%, 100% { transform: translate(-50%, -50%) rotate(-5deg) scale(1); }
  50% { transform: translate(-50%, -50%) rotate(7deg) scale(1.08); }
}
.hang {
  position: relative;
  width: fit-content;
  margin: -.05em auto 0 clamp(.3rem, 3vw, 2.2rem);
  padding-top: 58px;
  transform-origin: 50% -20px;
  animation: sway 5s ease-in-out infinite alternate;
}
@keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
.chain { position: absolute; top: -28px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.chain.c1 { left: 15%; }
.chain.c2 { left: 74%; }
.chain i {
  display: block;
  width: 12px; height: 16px;
  border: 3.5px solid var(--steel);
  border-radius: 50%;
  box-shadow: inset 1px 1px 0 rgba(223,232,255,.35);
}
.chain i:nth-child(even) { width: 9px; height: 13px; }
.sign {
  position: relative;
  background: linear-gradient(180deg, #232c44, #151a2b);
  border: 3.5px solid var(--steel);
  border-radius: 9px;
  padding: .32em .65em .22em;
  box-shadow: 0 0 22px rgba(157,184,255,.25), 0 10px 18px rgba(0,0,0,.5), inset 0 0 18px rgba(157,184,255,.08);
}
.sign::before, .sign::after,
.sign .rivet-l, .sign .rivet-r {
  content: '';
  position: absolute;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--steel);
  box-shadow: inset -1px -1px 0 rgba(0,0,0,.5);
}
.sign::before { top: 6px; left: 7px; }
.sign::after  { top: 6px; right: 7px; }
.sign .rivet-l { bottom: 6px; left: 7px; }
.sign .rivet-r { bottom: 6px; right: 7px; }
.sign .word {
  font-size: clamp(2.1rem, 7.5vw, 3.4rem);
  color: var(--ink-pale);
  letter-spacing: .09em;
  text-shadow: 0 0 10px rgba(157,184,255,.75), 0 0 30px rgba(157,184,255,.4);
}

.menu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: clamp(1.2rem, 5vw, 3.4rem);
  margin-top: auto;
  padding-top: 1.4rem;
  z-index: 2;
}
.hexbtn {
  background: none; border: none; padding: 0;
  cursor: pointer;
  font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: .5rem;
  width: clamp(7rem, 26vw, 10.5rem);   /* equal widths keep Market dead-center */
  transition: transform .18s ease;
}
.hexbtn:hover, .hexbtn:focus-visible { transform: translateY(-6px); }
.hexbtn:active { transform: scale(.93); }
.hexbtn:focus-visible { outline: 2px solid var(--electric); outline-offset: 8px; }
.hexwrap { filter: drop-shadow(0 7px 0 rgba(6,9,16,.7)); transition: filter .18s ease; }
.hexbtn:hover .hexwrap, .hexbtn:focus-visible .hexwrap { filter: drop-shadow(0 7px 0 rgba(6,9,16,.7)) drop-shadow(0 0 16px rgba(157,184,255,.65)); }
.hexo {
  width: clamp(5.6rem, 20vw, 7.6rem);
  aspect-ratio: 866 / 1000;
  background: var(--steel);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  display: grid;
  place-items: center;
}
.hexi {
  width: calc(100% - 9px);
  height: calc(100% - 9px);
  background: linear-gradient(180deg, #323c56, #1c2233);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  display: grid;
  place-items: center;
}
.hexi svg { width: 62%; height: auto; }
.hexbtn .lbl {
  font-size: clamp(1rem, 3vw, 1.25rem);
  line-height: 1.05;
  color: var(--ink-pale);
  letter-spacing: .06em;
  max-width: 9.5rem;
  text-align: center;
  text-shadow: 0 2px 0 rgba(6,9,16,.8), 0 0 14px rgba(157,184,255,.35);
}
footer {
  margin-top: 1rem;
  padding-bottom: .3rem;
  font-size: clamp(.85rem, 2.2vw, 1rem);
  letter-spacing: .1em;
  color: #7d88a6;
  z-index: 2;
  display: flex;
  align-items: baseline;
  gap: 1.2rem;
}
.replay {
  font-family: inherit; font-size: inherit; letter-spacing: inherit;
  color: var(--electric);
  background: none; border: none; cursor: pointer;
  text-decoration: underline dotted;
  padding: 0;
}
.replay:hover, .replay:focus-visible { color: var(--bolt); }

/* ---------- chrome: mute, skip, toast ---------- */
.mute {
  position: absolute;
  top: max(.9rem, env(safe-area-inset-top)); right: 1rem;
  width: 2.6rem; height: 2.6rem;
  place-items: center;
  font-size: 1.25rem;
  background: rgba(29,36,55,.85);
  border: 2px solid var(--steel);
  border-radius: 50%;
  cursor: pointer;
  z-index: 45;
}
.mute:focus-visible { outline: 2px solid var(--electric); outline-offset: 3px; }
.skip {
  position: absolute;
  bottom: 1.1rem; right: 1.2rem;
  font-family: inherit;
  font-size: 1rem;
  letter-spacing: .14em;
  color: var(--ink-dim);
  background: rgba(12,17,29,.6);
  border: 1.5px solid #3a4560;
  border-radius: 999px;
  padding: .55rem 1.1rem .4rem;
  cursor: pointer;
  z-index: 45;
}
.skip:hover, .skip:focus-visible { color: var(--ink-pale); border-color: var(--steel); }
.toast {
  position: absolute;
  left: 50%; bottom: 6%;
  transform: translateX(-50%) translateY(16px);
  background: linear-gradient(180deg, #232c44, #151a2b);
  border: 3px solid var(--steel);
  border-radius: 10px;
  padding: .6rem 1.4rem .45rem;
  font-size: clamp(1rem, 2.8vw, 1.2rem);
  letter-spacing: .05em;
  color: var(--ink-pale);
  box-shadow: 0 0 18px rgba(157,184,255,.3), 0 10px 18px rgba(0,0,0,.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease;
  z-index: 50;
  text-align: center;
  max-width: 92vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast b { color: var(--gold); font-weight: normal; }

@media (max-width: 620px) {
  .word-blast { margin-left: .9em; }

@media (prefers-reduced-motion: reduce) {

      <span>A Jing &amp; Ash Games production</span>
      <button class="replay" id="replay">&#9889; replay intro</button>
    </footer>
  </main>

  <button class="mute" id="mute" aria-pressed="false" aria-label="Mute sound">&#128266;</button>
  <button class="skip" id="skip">SKIP &#9656;&#9656;</button>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
  // ---------- thunder, wind and whoosh, synthesized live ----------
  const audio = {
    ctx: null, master: null, muted: false, windSrc: null, windGain: null,
    init() {
      if (this.ctx) return;
      try {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        this.ctx = new C();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 1;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; this.master = null; }
    },
    noiseBuf(dur, decay) {
      const n = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
      return buf;
    },
    play(buf, o) {
      try {
        const t = this.ctx.currentTime + (o.when || 0);
        const src = this.ctx.createBufferSource(); src.buffer = buf;
        const f = this.ctx.createBiquadFilter(); f.type = o.type || 'lowpass';
        f.frequency.setValueAtTime(o.f0, t);
        f.frequency.exponentialRampToValueAtTime(Math.max(o.f1, 30), t + o.dur * .8);
        const g = this.ctx.createGain(); g.gain.value = o.vol;
        src.connect(f); f.connect(g); g.connect(this.master);
        src.start(t);
      } catch (e) {}
    },
    crack(v) {
      if (!this.ctx) return;
      this.play(this.noiseBuf(.28, 3.5), { type: 'highpass', f0: 900, f1: 2400, dur: .28, vol: .5 * v });
      this.play(this.noiseBuf(3.2, 2.1), { f0: 520, f1: 70, dur: 3.2, vol: .55 * v, when: .09 });
      this.play(this.noiseBuf(4.6, 1.7), { f0: 220, f1: 45, dur: 4.6, vol: .32 * v, when: .55 });
    },
    rumble(v) {
      if (!this.ctx) return;
      this.play(this.noiseBuf(4.8, 1.8), { f0: 300, f1: 50, dur: 4.8, vol: v });
    },
    wind(on) {
      if (!this.ctx) return;
      try { this.windImpl(on); } catch (e) {}
    },
    windImpl(on) {
      if (on && !this.windSrc) {
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf(2.5, .001); src.loop = true;
        const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = .7;
        const g = this.ctx.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(this.master);
        src.start();
        g.gain.linearRampToValueAtTime(.15, this.ctx.currentTime + .5);
        this.windSrc = src; this.windGain = g;
      } else if (!on && this.windSrc) {
        const s = this.windSrc, g = this.windGain;
        this.windSrc = null;
        g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + .35);
        setTimeout(() => { try { s.stop(); } catch (e) {} }, 500);
      }
    },
    whoosh() {
      if (!this.ctx) return;
      try {
        const t = this.ctx.currentTime;
        const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf(.7, .9);
        const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
        f.frequency.setValueAtTime(220, t);
        f.frequency.exponentialRampToValueAtTime(1500, t + .3);
        f.frequency.exponentialRampToValueAtTime(240, t + .65);
        const g = this.ctx.createGain(); g.gain.value = .5;
        src.connect(f); f.connect(g); g.connect(this.master);
        src.start(t);
      } catch (e) {}
    },
    toggle() {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 1;
      return this.muted;
    }
  };

  // ---------- cinematic timeline ----------
  const $ = s => document.querySelector(s);
  const flash = $('#flash'), bolts = [...document.querySelectorAll('.boltsvg')];
  const home = $('.home'), page = $('.page');
  let timers = [], ambientOn = false;
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const setPhase = p => { document.body.className = 'phase-' + p; };
  const canAnimate = () =>
    matchMedia('(prefers-reduced-motion: no-preference)').matches && !!Element.prototype.animate;

  function strike(v) {
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
    const b = bolts[Math.random() < .5 ? 0 : 1];
    b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    audio.crack(v);
  }

  function startIntro() {
    clearTimers();
    setPhase('top');                 // visuals first — audio is best-effort
    audio.init();
    try { if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume(); } catch (e) {}
    at(350, () => strike(1));                                     // opening crack at the parapet
    at(1500, () => { setPhase('lean'); audio.wind(true); });      // you tilt over the edge, staring straight down
    at(3100, () => { setPhase('fall'); audio.whoosh(); });        // and drop — face first, the ground far below
    at(4300, () => audio.rumble(.28));                            // distant roll mid-fall
    at(6600, () => strike(.6));                                   // the ground is coming up fast
    at(7700, () => { document.body.className = 'phase-fall phase-whirl'; audio.wind(false); audio.whoosh(); });  // wheel around
    at(8130, () => arriveHome(true));                             // face the tower
  }

  function arriveHome(animate) {
    clearTimers();
    setPhase('home');
    startAmbient();
    at(1200, () => audio.rumble(.16));
    if (!animate || !canAnimate()) return;
    home.animate(
      [{ transform: 'rotate(-26deg) scale(1.22)', filter: 'blur(5px)', opacity: .35 },
       { transform: 'none', filter: 'blur(0px)', opacity: 1 }],
      { duration: 700, easing: 'cubic-bezier(.2,.9,.3,1)' });
    document.querySelectorAll('.word-bomb > *, .word-blast > *').forEach((el, i) =>
      el.animate(
        [{ transform: 'translateY(-1.6em) rotate(-10deg)', opacity: 0 }, { transform: 'none', opacity: 1 }],
        { duration: 600, delay: 350 + i * 70, easing: 'cubic-bezier(.2,1.7,.45,1)', fill: 'backwards' }));
    document.querySelectorAll('.hexbtn').forEach((el, i) =>
      el.animate(
        [{ transform: 'translateY(60px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
        { duration: 550, delay: 600 + i * 110, easing: 'cubic-bezier(.2,1.4,.4,1)', fill: 'backwards' }));
  }

  function startAmbient() {
    if (ambientOn) return;
    ambientOn = true;
    (function loop() {
      setTimeout(() => {
        if (document.body.classList.contains('phase-home') && !document.hidden) {
          flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
          const b = bolts[Math.random() < .5 ? 0 : 1];
          b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
          audio.rumble(.12);
        }
        loop();
      }, 7000 + Math.random() * 9000);
    })();
  }

  // ---------- controls ----------
  $('#skip').addEventListener('click', () => { audio.wind(false); arriveHome(canAnimate()); });
  $('#replay').addEventListener('click', () => { if (canAnimate()) startIntro(); });
  $('#mute').addEventListener('click', () => {
    audio.init();
    const m = audio.toggle();
    $('#mute').innerHTML = m ? '&#128263;' : '&#128266;';
    $('#mute').setAttribute('aria-pressed', m);
    $('#mute').setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  });

  // menu toasts + the bomb secret
  const toast = $('#toast');
  let tHide;
  document.querySelectorAll('.hexbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (/market/i.test(btn.dataset.name) && !String(location.href).startsWith('about')) {
        location.href = 'market.html';
        return;
      }
      if (/tower/i.test(btn.dataset.name) && !String(location.href).startsWith('about')) {
        location.href = 'tower.html';
        return;
      }
      if (/inventory/i.test(btn.dataset.name) && !String(location.href).startsWith('about')) {
        location.href = 'inventory.html';
        return;
      }
      if (/base/i.test(btn.dataset.name) && !String(location.href).startsWith('about')) {
        location.href = 'base.html';
        return;
      }
      toast.innerHTML = '<b>' + btn.dataset.name + '</b> &mdash; coming soon!';
      toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
      clearTimeout(tHide);
      tHide = setTimeout(() => toast.classList.remove('show'), 2200);
    });
  });
  $('.bomb-o').addEventListener('click', () => {
    page.classList.remove('kaboom'); void page.offsetWidth; page.classList.add('kaboom');
    audio.crack(.8);
  });

  // ---------- boot ----------
  // The intro auto-plays. Browsers only allow sound after the first tap or
  // keypress, so the first gesture unlocks the thunder mid-flight.
  const unlock = () => {
    audio.init();
    try { if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume(); } catch (e) {}
    const c = document.body.classList;
    if (c.contains('phase-lean') || c.contains('phase-fall')) audio.wind(true);
  };
  addEventListener('pointerdown', unlock, { once: true, capture: true });
  addEventListener('keydown', unlock, { once: true, capture: true });
  // no-JS default is the static home screen; with JS we route by hash
  if (location.hash === '#still') setPhase('home');
  else if (location.hash === '#look') setPhase('lean');
  else if (location.hash === '#fall') setPhase('fall');
  else if (canAnimate()) startIntro();
  else { setPhase('home'); startAmbient(); }
</script>
