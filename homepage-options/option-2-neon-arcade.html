  --steel: #8b93b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Press Start 2P', 'Courier New', monospace;
  color: #e8ecff;
  background:
    radial-gradient(1.6px 1.6px at 12% 18%, #ffffffcc 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 78% 9%, #ffffffaa 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 33% 64%, #ffffff88 50%, transparent 51%),
    radial-gradient(1.8px 1.8px at 89% 47%, #ffffffbb 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 56% 31%, #ffffff77 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 8% 82%, #ffffff99 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 68% 88%, #ffffff77 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 44% 6%, #ffffffaa 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 95% 74%, #ffffff88 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 22% 42%, #ffffff66 50%, transparent 51%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 70%, #2a0f3a 100%);
  overflow-x: hidden;
}
/* scanlines, like an old cabinet monitor */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  pointer-events: none;
  z-index: 50;
}
.page {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(1rem, 3vw, 2rem);
  position: relative;
}
.page.kaboom { animation: shake .4s linear; }
@keyframes shake {
  0%,100% { transform: translate(0,0); }
  20% { transform: translate(-7px,4px); }
  40% { transform: translate(6px,-5px); }
  60% { transform: translate(-5px,2px); }
  80% { transform: translate(4px,-2px); }
}

/* ---------- studio banner ---------- */
.studio { margin-top: clamp(1rem, 3.5vh, 2.2rem); text-align: center; line-height: 1.9; }
.studio .name {
  font-size: clamp(.62rem, 2vw, .85rem);
  letter-spacing: .25em;
  color: #cdd6ff;
  text-shadow: 0 0 8px rgba(160,180,255,.8);
}
.studio .name .arr { color: var(--cyan); margin: 0 .6em; }
.studio .presents { font-size: clamp(.5rem, 1.6vw, .62rem); color: #7f89b8; letter-spacing: .35em; }

/* ---------- logo ---------- */
.logo { position: relative; width: fit-content; margin: clamp(1.6rem, 6vh, 3.4rem) auto 0; }
.word { line-height: 1; white-space: nowrap; }
.word span { display: inline-block; }
.word-bomb {
  font-size: clamp(2.1rem, 8vw, 4.3rem);
  color: var(--yellow);
  transform: rotate(-2deg);
  position: relative;
  z-index: 1;
  text-shadow:
    0 0 6px #ffb300, 0 0 22px #ff7a00, 0 0 55px rgba(255,110,0,.65),
    4px 4px 0 #7a3c00;
  animation: hum 3.2s ease-in-out infinite;
}
.word-blast {
  font-size: clamp(1.8rem, 7vw, 3.8rem);
  color: var(--pink);
  transform: rotate(1.6deg);
  margin: .32em 0 0 2.6em;
  position: relative;
  z-index: 1;
  text-shadow:
    0 0 6px #ff1e55, 0 0 22px #ff0044, 0 0 55px rgba(255,0,80,.6),
    4px 4px 0 #59001d;
  animation: hum 3.2s ease-in-out 1.6s infinite;
}
@keyframes hum { 50% { filter: brightness(1.18); } }

.bomb-o {
  height: 1.06em; width: auto;
  vertical-align: -.12em;
  margin: 0 .06em;
  cursor: pointer;
  filter: drop-shadow(0 0 7px rgba(110,231,255,.8));
}
.bomb-o .spark { animation: flicker .9s infinite steps(2, jump-none); transform-origin: 60px 12px; }
@keyframes flicker { 50% { transform: scale(.5) rotate(25deg); opacity: .7; } }
.kaboom .bomb-o .spark { animation: bigspark .45s ease-out; }
@keyframes bigspark { 40% { transform: scale(3) rotate(45deg); } 100% { transform: scale(1); } }

.burst-a { position: relative; }
.burst-a svg {
  position: absolute;
  width: 2em; height: 2em;
  left: 50%; top: 42%;
  transform: translate(-50%, -50%);
  z-index: -1;
  animation: burstpulse 1.6s ease-in-out infinite;
  filter: drop-shadow(0 0 10px rgba(255,174,0,.85));
}
@keyframes burstpulse { 50% { transform: translate(-50%, -50%) scale(1.14) rotate(6deg); } }

/* ---------- hanging TOWER sign ---------- */
.hang {
  position: relative;
  width: fit-content;
  margin: .55em auto 0 clamp(.2rem, 3vw, 2.4rem);
  padding-top: 58px;
  transform-origin: 50% -20px;
  animation: sway 6s ease-in-out infinite alternate;
}
@keyframes sway { from { transform: rotate(-1deg); } to { transform: rotate(1deg); } }
.chain { position: absolute; top: -28px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.chain.c1 { left: 15%; }
.chain.c2 { left: 76%; }
.chain i { display: block; width: 11px; height: 15px; border: 3px solid var(--steel); border-radius: 50%; box-shadow: 0 0 5px rgba(139,147,184,.5); }
.chain i:nth-child(even) { width: 8px; height: 12px; }
.sign {
  background: linear-gradient(180deg, #171d38, #0e1226);
  border: 3px solid var(--cyan);
  border-radius: 10px;
  padding: .5em .7em .42em;
  box-shadow:
    0 0 14px rgba(62,243,255,.5), 0 0 46px rgba(62,243,255,.25),
    inset 0 0 22px rgba(62,243,255,.16);
}
.sign .word {
  font-size: clamp(1.35rem, 5.4vw, 2.5rem);
  color: var(--cyan);
  letter-spacing: .14em;
  text-shadow: 0 0 6px #19d5ff, 0 0 20px #00b3ff;
}
/* one tired neon letter, like a real arcade sign */
.sign .word span:nth-child(4) { animation: dying-neon 4.5s linear infinite; }
@keyframes dying-neon {
  0%, 18%, 22%, 63%, 67%, 100% { opacity: 1; }
  19%, 21% { opacity: .25; }
  64%, 66% { opacity: .3; }
  65% { opacity: .9; }
}

/* ---------- menu ---------- */
.select-hint {
  margin-top: clamp(2rem, 6.5vh, 3.6rem);
  font-size: clamp(.55rem, 1.8vw, .7rem);
  color: #9aa7ff;
  letter-spacing: .4em;
  animation: blink 1.1s steps(2, jump-none) infinite;
}
@keyframes blink { 50% { opacity: .15; } }
.menu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: clamp(1.3rem, 5.5vw, 3.6rem);
  margin-top: 1.2rem;
}
.hexbtn {
  --neon: var(--cyan);
  background: none; border: none; padding: 0;
  cursor: pointer;
  font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: .7rem;
  transition: transform .18s ease;
}
.hexbtn:hover, .hexbtn:focus-visible { transform: translateY(-6px); }
.hexbtn:active { transform: scale(.93); }
.hexbtn:focus-visible { outline: 2px solid var(--neon); outline-offset: 10px; }
.hexwrap { filter: drop-shadow(0 0 9px var(--neon)); transition: filter .18s ease; }
.hexbtn:hover .hexwrap, .hexbtn:focus-visible .hexwrap { filter: drop-shadow(0 0 16px var(--neon)) drop-shadow(0 0 34px var(--neon)); }
.hexo {
  width: clamp(6rem, 21vw, 7.6rem);
  aspect-ratio: 866 / 1000;
  background: var(--neon);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  display: grid;
  place-items: center;
}
.hexi {
  width: calc(100% - 7px);
  height: calc(100% - 7px);
  background: linear-gradient(180deg, #161c38, #0d1126);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  display: grid;
  place-items: center;
}
.hexi svg { width: 62%; height: auto; }
.hexbtn .lbl {
  font-size: clamp(.52rem, 1.7vw, .66rem);
  line-height: 1.7;
  color: var(--neon);
  text-shadow: 0 0 8px var(--neon);
  letter-spacing: .12em;
  max-width: 9.5rem;
  text-align: center;
}
.hexbtn.b-tower  { --neon: var(--cyan); }
.hexbtn.b-market { --neon: var(--magenta); }
.hexbtn.b-stats  { --neon: var(--lime); }

/* ---------- embers ---------- */
.ember {
  position: fixed;
  bottom: -12px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 8px var(--orange);
  animation: rise linear infinite;
  pointer-events: none;
}
.ember:nth-child(1) { left: 8%;  animation-duration: 11s; }
.ember:nth-child(2) { left: 26%; animation-duration: 15s; animation-delay: 3s; background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.ember:nth-child(3) { left: 47%; animation-duration: 13s; animation-delay: 6s; }
.ember:nth-child(4) { left: 66%; animation-duration: 16s; animation-delay: 1.5s; }
.ember:nth-child(5) { left: 82%; animation-duration: 12s; animation-delay: 4.5s; background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.ember:nth-child(6) { left: 93%; animation-duration: 17s; animation-delay: 8s; }
@keyframes rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  8% { opacity: .9; }
  60% { transform: translateY(-60vh) translateX(14px); opacity: .55; }
  100% { transform: translateY(-104vh) translateX(-8px); opacity: 0; }
}

/* ---------- toast & footer ---------- */
.toast {
  position: fixed;
  left: 50%; bottom: 6%;
  transform: translateX(-50%) translateY(16px);
  background: #0c1022ee;
  border: 2px solid var(--cyan);
  border-radius: 8px;
  box-shadow: 0 0 16px rgba(62,243,255,.4);
  padding: .8rem 1.3rem;
  font-size: clamp(.55rem, 1.8vw, .7rem);
  line-height: 1.8;
  letter-spacing: .08em;
  color: var(--cyan);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 60;
  max-width: 92vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
footer {
  margin-top: auto;
  padding: 1.6rem 1rem .6rem;
  font-size: clamp(.48rem, 1.5vw, .58rem);
  color: #5d6690;
  letter-spacing: .22em;
  text-align: center;
  line-height: 2.1;
}
footer .credit { color: #8f9ac9; }
@media (max-width: 620px) {
  .word-blast { margin-left: 1.1em; }
  .hang { margin-left: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .hang, .bomb-o .spark, .burst-a svg, .word-bomb, .word-blast,
  .select-hint, .ember, .sign .word span:nth-child(4), .page.kaboom { animation: none !important; }
}
</style>

<script>
  const toast = document.getElementById('toast');
  const page = document.querySelector('.page');
  let tHide;
  document.querySelectorAll('.hexbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      toast.textContent = '> ' + btn.dataset.name + ': LEVEL LOADING... COMING SOON!';
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
      clearTimeout(tHide);
      tHide = setTimeout(() => toast.classList.remove('show'), 2400);
    });
  });
  // secret: tap the bomb!
  document.querySelector('.bomb-o').addEventListener('click', () => {
    page.classList.remove('kaboom');
    void page.offsetWidth;
    page.classList.add('kaboom');
  });
</script>
